<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F2148">
<title>LoanBook</title>
<link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Google's sign-in library arrives asynchronously, possibly before the app
   script below has been parsed. These flags record whether it loaded or
   failed so the sign-in screen can show the right thing whenever it checks. */
window.__gis = {loaded:false, failed:false};
function __gisLoaded(){ window.__gis.loaded = true; if(window.onGisChange) window.onGisChange(); }
function __gisFailed(){ window.__gis.failed = true; if(window.onGisChange) window.onGisChange(); }
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="__gisLoaded()" onerror="__gisFailed()"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#F4F7FC;
  --surface:#FFFFFF;
  --surface-2:#EDF2FA;
  --surface-3:#E0E9F6;
  --ink:#0F1D33;
  --ink-soft:#4C5C77;
  --ink-faint:#8B99B2;
  --border:#DCE5F3;
  --border-strong:#C1D0E7;
  --accent:#2158A6;
  --accent-strong:#153E7B;
  --accent-soft:#E3ECFB;
  --gold:#A9781F;
  --gold-soft:#F4E9D2;
  --red:#AD2E3E;
  --red-soft:#F7E3E5;
  --teal:#0E7C86;
  --teal-soft:#DFF1F2;
  --sidebar-bg:#0F2148;
  --sidebar-bg-2:#0A1830;
  --sidebar-text:#DCE6F7;
  --sidebar-text-dim:#7C92BB;
  --sidebar-active:#1C3B72;
  --shadow-sm:0 1px 2px rgba(15,29,51,0.06);
  --shadow-md:0 4px 16px rgba(15,29,51,0.08);
  --shadow-lg:0 12px 32px rgba(15,29,51,0.14);
  --radius-md:10px;
  --radius-lg:12px;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:700;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-0.01em;}
h1{font-size:22px;} h3{font-size:15px;}
a{color:var(--accent);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

/* ============ AUTH ============ */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;box-shadow:var(--shadow-md);}
.auth-brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;}
.auth-brand img{width:30px;height:30px;flex:none;}
.auth-brand .bn{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
.auth-brand .bn span{color:var(--accent);}
.auth-card h2{font-size:17px;margin-bottom:5px;}
.auth-card .auth-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
.auth-error{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;line-height:1.45;}
.auth-note{font-size:11.5px;color:var(--ink-faint);margin-top:16px;line-height:1.5;}
.auth-link{display:block;background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:0;margin:14px auto 0;font-family:var(--font-body);}
.auth-link:hover{text-decoration:underline;}
.auth-actions{display:flex;flex-direction:column;gap:10px;}
.loading-card{text-align:center;padding:8px 0;}
.spinner{width:26px;height:26px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:4px auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ SHELL ============ */
#shell{display:none;min-height:100vh;}
#shell.ready{display:flex;}
#sidebar{width:230px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 18px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,0.08);}
.brand-mark{width:28px;height:28px;flex:none;display:block;}
.brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:0.2px;}
nav.mainnav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text-dim);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;position:relative;}
.navlink svg{width:17px;height:17px;stroke:currentColor;flex:none;}
.navlink:hover{background:rgba(255,255,255,0.05);color:var(--sidebar-text);}
.navlink.active{background:var(--sidebar-active);color:#fff;}
.navlink .badge-count{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:var(--font-mono);}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:9px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#241b06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
.user-name{color:#fff;font-size:12.5px;font-weight:600;word-break:break-word;}
.signout{background:none;border:none;color:var(--sidebar-text-dim);font-size:11px;cursor:pointer;padding:0;text-align:left;}
.signout:hover{color:#fff;text-decoration:underline;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;flex:1;max-width:400px;min-width:0;}
.search-input{width:100%;padding:9px 14px 9px 36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13.5px;font-family:var(--font-body);}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-faint);pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:50;}
.sr-item{display:flex;flex-direction:column;gap:1px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--surface-2);}
.sr-title{font-size:13px;font-weight:600;}
.sr-meta{font-size:11.5px;color:var(--ink-soft);}
.sr-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);flex:none;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface);}
.notif-panel{position:absolute;top:56px;right:26px;width:350px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;}
.notif-list{max-height:380px;overflow-y:auto;}
.notif-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-dotcolor{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
.notif-text{font-size:12.5px;line-height:1.45;}
.notif-time{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.menu-toggle{display:none;}
#sidebarBackdrop{display:none;}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer;font-family:var(--font-body);}
.sync-badge:hover{background:var(--surface);border-color:var(--border);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.sync-banner{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 26px;font-size:12.5px;line-height:1.45;border-bottom:1px solid var(--border);}
.sync-banner.warn{background:var(--gold-soft);color:#6b4c12;}
.sync-banner.danger{background:var(--red-soft);color:var(--red);}
.sync-banner.info{background:var(--accent-soft);color:var(--accent-strong);}
.sync-banner .sb-text{flex:1;min-width:200px;}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.gbtn:hover{background:var(--surface-2);}
.gbtn:disabled{opacity:0.6;cursor:wait;}
.gbtn svg{width:18px;height:18px;}

#app{flex:1;padding:24px 26px 60px;max-width:1380px;width:100%;margin:0 auto;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:5px;max-width:580px;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
.btn svg{width:15px;height:15px;stroke:currentColor;}
.btn:hover{background:var(--surface-2);}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-danger{color:var(--red);border-color:var(--border-strong);}
.btn-danger:hover{background:var(--red-soft);}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff;}
.btn-danger-solid:hover{background:#8f2433;border-color:#8f2433;}
.row-btn{padding:4px 10px;font-size:11.5px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-weight:600;font-family:var(--font-body);}
.row-btn:hover{background:var(--surface-2);color:var(--ink);}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:18px;overflow:hidden;}
.kpi-card{background:var(--surface);padding:15px 18px;}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-soft);font-weight:600;}
.kpi-value{font-size:21px;font-weight:600;margin-top:6px;color:var(--ink);}
.kpi-value.mono{font-family:var(--font-mono);font-size:18px;}
.kpi-value.warn{color:var(--gold);}
.kpi-value.danger{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.mini-row{display:flex;flex-wrap:wrap;column-gap:26px;row-gap:6px;padding:2px 2px 16px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.mini-card{display:flex;align-items:baseline;gap:8px;}
.mini-card .mc-label{font-size:12.5px;color:var(--ink-soft);}
.mini-card .mc-value{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--ink);}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:19px 21px;margin-bottom:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.shint{font-size:11.5px;color:var(--ink-faint);}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid-2 > *{min-width:0;}
@media(max-width:1080px){.grid-2{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);}}

.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-soft);padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;}
tbody td{padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.rowlink{cursor:pointer;}
tbody tr.rowlink:hover{background:var(--surface-2);}
tbody tr.total-row td{background:var(--surface-2);font-weight:600;}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
td.act{text-align:right;width:1%;}
.cell-primary{font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.input,select.select,textarea.textarea{padding:8px 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-family:var(--font-body);}
select.select{padding:8px 28px 8px 11px;max-width:100%;}
textarea.textarea{width:100%;resize:vertical;min-height:62px;}
.input:focus,select.select:focus,textarea.textarea:focus{border-color:var(--accent);}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;color:var(--ink-soft);}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.badge-active{color:var(--accent);}
.badge-paid{color:var(--teal);}
.badge-completed{color:var(--teal);}
.badge-partial{color:var(--gold);}
.badge-upcoming{color:var(--ink-faint);}
.badge-duetoday{color:var(--gold);}
.badge-overdue{color:var(--red);}
.badge-defaulted{color:var(--red);}
.badge-nopayment{color:var(--ink-faint);}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:19px 21px;}
.chart-box{position:relative;height:225px;}

.progress-track{height:9px;background:var(--surface-3);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width 0.4s ease;}
.progress-fill.red{background:var(--red);}
.progress-fill.teal{background:var(--teal);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,0.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:36px 20px;overflow-y:auto;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.modal-box.wide{max-width:780px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 21px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:17px;}
.modal-body{padding:19px 21px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:15px 21px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.modal-foot .spacer{flex:1;}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;}
.close-x svg{width:15px;height:15px;stroke:currentColor;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.form-field .hint{font-size:10.5px;color:var(--ink-faint);}
.form-field .req{color:var(--red);}
.amount-hint{font-size:11px;color:var(--accent-strong);font-family:var(--font-mono);min-height:15px;}
.amount-hint.bad{color:var(--red);font-family:var(--font-body);}
.form-msg:empty{display:none;}
.form-msg{border-radius:9px;padding:11px 13px;font-size:12.5px;margin-top:16px;line-height:1.5;}
.form-msg.err{background:var(--red-soft);color:var(--red);}
.form-msg.warn{background:var(--gold-soft);color:#6b4c12;}
.form-msg ul{margin:4px 0 0;padding-left:18px;}
.fieldset-legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);margin:18px 0 10px;padding-top:14px;border-top:1px dashed var(--border);}
.fieldset-legend:first-child{margin-top:0;padding-top:0;border-top:none;}
.calc-preview{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;}
.cp-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
.cp-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:2px;}
.sched-mini{margin-top:10px;}
.sched-mini table{font-size:12px;}
.sched-mini thead th{padding:7px 10px;}
.sched-mini tbody td{padding:7px 10px;}
.struct-pick{display:flex;flex-direction:column;gap:8px;}
.struct-opt{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;cursor:pointer;align-items:flex-start;}
.struct-opt:hover{background:var(--surface-2);}
.struct-opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.struct-opt input{margin-top:3px;}
.struct-opt .so-title{display:block;font-size:13px;font-weight:600;}
.struct-opt .so-desc{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

#toastRoot{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-lg);max-width:360px;}
.toast.error{border-left:3px solid var(--red);}

.detail-header{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;}
.avatar-lg{width:52px;height:52px;border-radius:13px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none;}
.detail-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.detail-meta-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-soft);}
.stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin:16px 0;}
.st{background:var(--surface);padding:13px 16px;}
.st-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;font-weight:600;}
.st-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:4px;}
@media(max-width:1080px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
.notes-list{display:flex;flex-direction:column;gap:10px;}
.note-item{background:var(--surface-2);border-radius:9px;padding:11px 36px 11px 13px;position:relative;}
.note-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.note-meta{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.note-del{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:16px;line-height:1;}
.note-del:hover{background:var(--red-soft);color:var(--red);}
.audit-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-item:last-child{border-bottom:none;}
.audit-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
.audit-time{color:var(--ink-faint);font-size:11px;}
.empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint);}
.empty-state svg{width:34px;height:34px;stroke:var(--ink-faint);margin-bottom:10px;}
.empty-state p{font-size:13px;margin:0 0 14px;}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.report-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--ink);}
.report-tile:hover{border-color:var(--accent);}
.report-tile.active{border-color:var(--accent);background:var(--accent-soft);}
.report-tile h4{font-size:13.5px;margin-bottom:3px;}
.report-tile p{font-size:11.5px;color:var(--ink-soft);margin:0;}
@media(max-width:1080px){.report-grid{grid-template-columns:1fr 1fr;}}
.statement-figs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.sf-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;}
.sf-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:3px;}
.set-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.set-row:last-child{border-bottom:none;}
.set-label{font-size:13px;font-weight:600;}
.set-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;max-width:560px;}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:none;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--border-strong);border-radius:28px;cursor:pointer;transition:background .2s;}
.switch .slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:var(--shadow-sm);transition:transform .2s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(20px);}
.switch input:focus-visible + .slider{outline:2px solid var(--accent);outline-offset:2px;}
.form-field label.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;}
.callout{background:var(--gold-soft);border-radius:9px;padding:12px 14px;font-size:12.5px;color:#6b4c12;line-height:1.5;}
.callout.info{background:var(--accent-soft);color:var(--accent-strong);}
.callout.danger{background:var(--red-soft);color:var(--red);}
.danger-zone{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}

/* ============ LETTER ============ */
#printArea{display:none;}
.letter{background:#fff;color:#111;padding:42px 46px;font-size:13.5px;line-height:1.65;max-width:760px;margin:0 auto;}
.letter-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:22px;gap:20px;}
.letter-org{font-size:17px;font-weight:700;}
.letter-org-sub{font-size:11.5px;color:#555;margin-top:3px;white-space:pre-line;}
.letter-ref{font-size:11.5px;color:#555;text-align:right;}
.letter h4{font-size:14px;margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.5px;}
.letter table{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0;}
.letter th,.letter td{border:1px solid #bbb;padding:7px 9px;text-align:left;white-space:normal;}
.letter th{background:#f1f1f1;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;}
.letter td.num,.letter th.num{text-align:right;font-family:var(--font-mono);}
.letter-terms{margin:14px 0;}
.letter-terms div{display:flex;gap:10px;padding:5px 0;border-bottom:1px dotted #ccc;}
.letter-terms .lt-k{width:210px;color:#555;flex:none;}
.letter-terms .lt-v{font-weight:600;}
.letter-sign{margin-top:34px;}
.letter-sign .sig-line{border-top:1px solid #111;width:220px;margin-top:38px;padding-top:5px;font-size:12px;}

@media print{
  #sidebar,#topbar,#syncBanner,.no-print,.head-actions,.btn,.row-btn,td.act,th.act,#toastRoot,#modalRoot{display:none !important;}
  #app{max-width:100%;padding:0;}
  body{background:#fff;}
  .section,.chart-card{border:none;padding:0;margin-bottom:18px;}
  body.print-letter #shell{display:none !important;}
  body.print-letter #printArea{display:block !important;}
  .letter{padding:0;max-width:100%;}
}
@media(max-width:900px){
  #sidebar{position:fixed;left:-230px;top:0;bottom:0;z-index:110;transition:left 0.2s;}
  #sidebar.open{left:0;}
  #sidebarBackdrop.open{display:block;position:fixed;inset:0;background:rgba(8,13,25,0.5);z-index:105;}
  .menu-toggle{display:flex;}
  #topbar{padding:10px 14px;gap:8px;}
  .topbar-actions{gap:6px;}
  .search-wrap{max-width:none;}
  .search-wrap .search-input{font-size:16px;}
  .topbar-actions .btn span{display:none;}
  .sync-badge .sync-text{display:none;}
  .sync-badge{padding:6px;}
  .sync-banner{padding:10px 14px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .report-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .input,select.select,textarea.textarea{font-size:16px;}
  .detail-header{flex-direction:column;}
  .head-actions{width:100%;}
  .head-actions .btn{flex:1;justify-content:center;}
  #app{padding:16px 12px 50px;}
  .modal-overlay{padding:0;align-items:flex-start;}
  .modal-box{max-width:none;min-height:100%;border-radius:0;border:none;}
  .modal-body{max-height:none;}
  .notif-panel{right:10px;left:10px;width:auto;top:54px;}
  .statement-figs{grid-template-columns:1fr 1fr;}
  .letter{padding:22px 18px;}
  .letter-terms .lt-k{width:130px;}
  #toastRoot{left:12px;right:12px;bottom:14px;}
  .toast{max-width:none;}
}
@media(max-width:480px){
  /* Two across on a phone, so "who owes me" is reachable without a long scroll. */
  .kpi-card{padding:12px 13px;}
  .kpi-label{font-size:10px;letter-spacing:0.5px;}
  .kpi-value{font-size:18px;}
  .kpi-value.mono{font-size:15px;}
  .kpi-sub{font-size:10.5px;}
  .calc-preview{grid-template-columns:1fr;}
}
</style>

<script>
/* =========================================================================
   LoanBook — single-user ledger for short-term soft loans.

   Interest is a MONTHLY rate set per loan (it may be 0%). Three repayment
   structures are supported. Balances are never stored: they are worked out
   from the payment ledger each time, so part payments roll forward on their
   own and editing a payment fixes every figure that depends on it.

   Storage: the book is one readable loanbook.json in the owner's own Google
   Drive, with a copy on each device so it opens instantly and keeps working
   through a dropped connection. Devices never overwrite one another. Each
   sync downloads Drive's copy, merges it record by record with what this
   device holds, and uploads the result. Deletions travel as tombstones so a
   device that still had the record cannot bring it back. Once a day a dated
   copy of the whole book is also kept in a "LoanBook daily copies" folder.
   ========================================================================= */

/* OAuth Client ID from Google Cloud Console. Public by design — it ships in
   the page and identifies the app to Google. The client secret is NOT here:
   a static site cannot keep one, and the browser token flow does not use it.
   Access is bounded by the authorised JavaScript origins set on the client. */
const GOOGLE_CLIENT_ID = '108999565212-hm2sdqajqq3hos8mg5ids1aa36hgr35f.apps.googleusercontent.com';
/* Web app URL of the reminder service (reminder-service/Code.gs), deployed
   once from the developer's Google account. Empty until then, which simply
   shows the daily reminder option as "not available yet". */
const REMINDER_SERVICE_URL = '';
const GAPI = 'https://www.googleapis.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SCOPES = 'openid email profile ' + DRIVE_SCOPE;
const BOOK_FILENAME = 'loanbook.json';
const COPIES_FOLDER = 'LoanBook daily copies';
const KEEP_DAILY_COPIES = 60;
const AUTH_KEY = 'loanbook_auth';
const LEGACY_VAULT_KEY = 'loanbook_vault';
const SCHEMA = 3;
const AUDIT_CAP = 5000;
const COLLECTIONS = ['borrowers','loans','payments','notes','audit'];

let TODAY = toISO(new Date());

/* ---------- utilities ---------- */
function toISO(dt){ const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
function isISODate(s){
  if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d]=s.split('-').map(Number); const t=new Date(y,m-1,d);
  return t.getFullYear()===y && t.getMonth()===m-1 && t.getDate()===d;
}
function addMonths(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return toISO(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last))); }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function money(n){ n = Number(n); return isFinite(n) ? Math.round(n*100)/100 : 0; }
function fmtNaira(n){ n = Number(n); if(!isFinite(n)) n = 0; const neg=n<0; n=Math.round(Math.abs(n)); let s=String(n),out=''; for(let i=0;i<s.length;i++){ if(i>0 && (s.length-i)%3===0) out+=','; out+=s[i]; } return (neg?'-':'')+'₦'+out; }
function fmtPlain(n){ n = Number(n); return isFinite(n) ? n.toLocaleString('en-US',{maximumFractionDigits:2}) : ''; }
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){ if(!isISODate(iso)) return '—'; const [y,m,d]=iso.split('-').map(Number); return `${String(d).padStart(2,'0')} ${MONTHS_SHORT[m-1]} ${y}`; }
function fmtDateLong(iso){ if(!isISODate(iso)) return '—'; const [y,m,d]=iso.split('-').map(Number); return `${d} ${MONTHS_LONG[m-1]} ${y}`; }
function fmtMonth(ym){ const [y,m]=ym.split('-').map(Number); return `${MONTHS_SHORT[m-1]} ${y}`; }
function fmtDateTime(ts){ if(!ts) return '—'; const d=new Date(ts); if(isNaN(d)) return '—'; return fmtDate(toISO(d))+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* A value made safe to drop into an inline handler, e.g. onclick="f(${jsArg(id)})".
   The browser decodes the entities before running the code, so any string —
   quotes and all — arrives intact. */
function jsArg(v){ return esc(JSON.stringify(v==null?'':v)); }
function initials(name){ const p=String(name||'').trim().split(/\s+/).filter(Boolean); return p.slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?'; }
function relTime(iso){ const d=daysBetween(TODAY,iso); if(d===0) return 'today'; if(d===1) return 'tomorrow'; if(d>1) return 'in '+d+'d'; if(d===-1) return '1d ago'; return (-d)+'d ago'; }
function pct(a,b){ return b>0 ? Math.round(a/b*1000)/10 : 0; }
function plural(n, word){ return `${n} ${word}${n===1?'':'s'}`; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function newUid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function $(id){ return document.getElementById(id); }
/* Amounts are typed the way people write them: 500,000 or ₦500000 both work. */
function parseAmount(v){
  if(typeof v==='number') return v;
  const s = String(v==null?'':v).replace(/[₦,\s]/g,'').replace(/^N(?=\d)/i,'');
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}
function parseRate(v){ const s = String(v==null?'':v).replace(/%/g,'').trim(); return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; }
function byName(a,b){ return a.name.localeCompare(b.name, undefined, {sensitivity:'base'}); }

const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  borrowers:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  loans:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>',
  payments:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H3a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-3"/></svg>',
  letter:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>',
};
function icon(n){ return ICONS[n]||''; }

/* =========================== BOOK SHAPE ===========================
   Every record carries a random uid (its identity across devices) and _u,
   the time it was last changed. The human-facing id (AO-001, LN-0007) is
   what links records together and what appears on letters. */
function freshState(){
  return {
    schema:SCHEMA,
    borrowers:[], loans:[], payments:[], notes:[], audit:[],
    tombstones:{},
    seq:{loan:0, payment:0, note:0, audit:0},
    business:{name:'', address:'', phone:'', signatory:'', _u:0},
    reminders:freshReminders(),
    resetAt:0,
    createdAt:Date.now(),
    updatedAt:0
  };
}
/* Daily reminder email preferences. Off until the owner opts in. They travel
   with the book, so switching them on or off on any device applies everywhere,
   and the reminder script in the owner's Google account reads them from Drive. */
function freshReminders(){ return {enabled:false, email:'', hour:7, aheadDays:7, everyDay:false, timeZone:'', _u:0}; }
function normalizeReminders(r){
  r = (r && typeof r==='object') ? r : {};
  const int = (v, lo, hi, d)=>{ const n = parseInt(v,10); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
  return {enabled:!!r.enabled, email:String(r.email||'').trim(), hour:int(r.hour,0,23,7), aheadDays:int(r.aheadDays,1,31,7),
    everyDay:!!r.everyDay, timeZone:String(r.timeZone||''), _u:Number(r._u)||0};
}
function hasContent(b){ return !!(b && (b.borrowers.length || b.loans.length || b.payments.length)); }

const ID_RE = /^[A-Za-z0-9][A-Za-z0-9-]{0,39}$/;
const ID_KINDS = {
  loans:{kind:'loan', prefix:'LN', pad:4},
  payments:{kind:'payment', prefix:'PMT', pad:4},
  notes:{kind:'note', prefix:'NOTE', pad:4}
};
function maxSuffix(list, prefix){
  let m = 0; const re = new RegExp('^'+prefix+'-(\\d+)$');
  for(const r of list){ const x = re.exec(r.id||''); if(x) m = Math.max(m, +x[1]); }
  return m;
}
function nextIdIn(book, coll){
  const k = ID_KINDS[coll];
  const n = Math.max(book.seq[k.kind]||0, maxSuffix(book[coll], k.prefix)) + 1;
  book.seq[k.kind] = n;
  return k.prefix+'-'+String(n).padStart(k.pad,'0');
}
/* Borrower IDs read from the name so repeat customers are recognisable at a
   glance (Ade profiles people by name, not by number): Amaka Osu → AO-001. */
function makeBorrowerIdIn(book, name){
  let base = initials(name).replace(/[^A-Z]/g,'') || 'BR';
  if(base.length < 2) base = base+'X';
  const taken = new Set(book.borrowers.map(b=>b.id));
  let n = 1, id;
  do { id = base+'-'+String(n).padStart(3,'0'); n++; } while(taken.has(id));
  return id;
}

/* Brings any book — an old version, a backup, a hand-edited file — into the
   current shape, without losing fields it does not recognise. Legacy records
   get a uid derived from their id, so two devices holding the same old book
   agree on who is who. */
function normalizeBook(input){
  if(!input || typeof input!=='object' || Array.isArray(input)) throw new Error('That is not a LoanBook file.');
  const d = input, S = v => v==null ? '' : String(v);
  const b = freshState();
  b.createdAt = Number(d.createdAt) || b.createdAt;
  b.updatedAt = Number(d.updatedAt) || 0;
  b.resetAt = Number(d.resetAt) || 0;
  if(d.seq && typeof d.seq==='object') for(const k in d.seq) b.seq[k] = Number(d.seq[k])||0;
  const biz = (d.business && typeof d.business==='object') ? d.business : {};
  b.business = {name:S(biz.name), address:S(biz.address), phone:S(biz.phone), signatory:S(biz.signatory), _u:Number(biz._u)||0};
  b.reminders = normalizeReminders(d.reminders);
  if(d.tombstones && typeof d.tombstones==='object' && !Array.isArray(d.tombstones))
    for(const k in d.tombstones){ const v = Number(d.tombstones[k]); if(v) b.tombstones[k] = v; }
  const arr = k => Array.isArray(d[k]) ? d[k].filter(x=>x && typeof x==='object' && !Array.isArray(x)) : [];

  b.borrowers = arr('borrowers').map(x=>Object.assign({}, x, {
    id:S(x.id), uid:S(x.uid)||('borrowers:'+S(x.id)), _u:Number(x._u)||0,
    name:S(x.name).trim().replace(/\s+/g,' ') || 'Unnamed borrower',
    phone:S(x.phone), email:S(x.email), address:S(x.address), idType:S(x.idType), idNumber:S(x.idNumber),
    guarantor:S(x.guarantor), employment:S(x.employment), bankInfo:S(x.bankInfo),
    dateAdded:isISODate(x.dateAdded) ? x.dateAdded : ''
  }));
  b.loans = arr('loans').map(x=>{
    const l = Object.assign({}, x, {
      id:S(x.id), uid:S(x.uid)||('loans:'+S(x.id)), _u:Number(x._u)||0,
      borrowerId:S(x.borrowerId), principal:money(x.principal),
      rate:Math.max(0, Number(x.rate)||0), months:Math.min(120, Math.max(1, parseInt(x.months,10)||1)),
      structure:STRUCTURES[x.structure] ? x.structure : 'interest-only',
      purpose:S(x.purpose)
    });
    l.startDate = isISODate(x.startDate) ? x.startDate : (isISODate(x.createdDate) ? x.createdDate : TODAY);
    l.firstPaymentDate = isISODate(x.firstPaymentDate) ? x.firstPaymentDate : addMonths(l.startDate,1);
    l.createdDate = isISODate(x.createdDate) ? x.createdDate : l.startDate;
    applyTerms(l);
    return l;
  });
  b.payments = arr('payments').map(x=>Object.assign({}, x, {
    id:S(x.id), uid:S(x.uid)||('payments:'+S(x.id)), _u:Number(x._u)||0,
    loanId:S(x.loanId), borrowerId:S(x.borrowerId),
    date:isISODate(x.date) ? x.date : (Number(x.timestamp) ? toISO(new Date(Number(x.timestamp))) : '2000-01-01'),
    amount:money(x.amount), method:S(x.method)||'Other', reference:S(x.reference), notes:S(x.notes),
    timestamp:Number(x.timestamp)||0
  }));
  b.notes = arr('notes').map(x=>Object.assign({}, x, {
    id:S(x.id), uid:S(x.uid)||('notes:'+S(x.id)), _u:Number(x._u)||0,
    borrowerId:x.borrowerId ? S(x.borrowerId) : null, loanId:x.loanId ? S(x.loanId) : null,
    text:S(x.text), createdAt:Number(x.createdAt)||0
  }));
  b.audit = arr('audit').map(x=>Object.assign({}, x, {
    id:S(x.id), uid:S(x.uid)||('audit:'+S(x.id)+':'+(Number(x.timestamp)||0)),
    action:S(x.action), entity:S(x.entity), entityId:S(x.entityId), detail:S(x.detail), user:S(x.user),
    timestamp:Number(x.timestamp)||0
  }));

  for(const c of COLLECTIONS){
    const m = new Map();
    for(const r of b[c]){
      if(b.tombstones[r.uid]) continue;
      const o = m.get(r.uid);
      if(!o || (r._u||0) > (o._u||0)) m.set(r.uid, r);
    }
    b[c] = [...m.values()];
  }
  b.audit.sort((p,q)=>q.timestamp-p.timestamp);
  if(b.audit.length > AUDIT_CAP) b.audit.length = AUDIT_CAP;
  repairIds(b, null);
  const loanById = new Map(b.loans.map(l=>[l.id,l]));
  for(const p of b.payments){ const l = loanById.get(p.loanId); if(l) p.borrowerId = l.borrowerId; }
  for(const c in ID_KINDS){ const k = ID_KINDS[c]; b.seq[k.kind] = Math.max(b.seq[k.kind]||0, maxSuffix(b[c], k.prefix)); }
  return b;
}

/* Gives every record a usable, unique id. When two devices each create a
   record between syncs they can pick the same next number; the record that
   has already reached Drive keeps it and this device's new one is renumbered,
   along with everything of this device's that points at it. */
function repairIds(b, localOnly){
  localOnly = localOnly || new Set();
  const renamed = {borrowers:new Map(), loans:new Map(), payments:new Map(), notes:new Map()};
  const everywhere = {borrowers:new Map(), loans:new Map()};
  for(const c of ['borrowers','loans','payments','notes']){
    const kept = new Set();
    const order = b[c].map((r,i)=>({r,i}))
      .sort((x,y)=> (localOnly.has(x.r.uid)?1:0) - (localOnly.has(y.r.uid)?1:0) || x.i-y.i);
    for(const {r} of order){
      const valid = ID_RE.test(r.id);
      if(valid && !kept.has(r.id)){ kept.add(r.id); continue; }
      const old = r.id;
      r.id = c==='borrowers' ? makeBorrowerIdIn(b, r.name) : nextIdIn(b, c);
      kept.add(r.id);
      if(!valid){ if(everywhere[c]) everywhere[c].set(old, r.id); }
      else if(localOnly.has(r.uid)) renamed[c].set(old, r.id);
    }
  }
  const fix = (map, id) => (id!=null && map.has(id)) ? map.get(id) : id;
  const mine = r => localOnly.has(r.uid);
  for(const l of b.loans){
    if(mine(l)) l.borrowerId = fix(renamed.borrowers, l.borrowerId);
    l.borrowerId = fix(everywhere.borrowers, l.borrowerId);
  }
  for(const x of [...b.payments, ...b.notes]){
    if(mine(x)){ x.loanId = fix(renamed.loans, x.loanId); x.borrowerId = fix(renamed.borrowers, x.borrowerId); }
    x.loanId = fix(everywhere.loans, x.loanId); x.borrowerId = fix(everywhere.borrowers, x.borrowerId);
  }
  for(const a of b.audit){
    if(!mine(a)) continue;
    for(const c in renamed){ if(renamed[c].has(a.entityId)){ a.entityId = renamed[c].get(a.entityId); break; } }
  }
}

/* Record-by-record merge of two copies of the book. A record present on one
   side only is kept; one changed on both keeps the later change; a deleted
   record stays deleted. Clearing or restoring the book is deliberate, so the
   copy that was reset most recently replaces the other wholesale. */
function mergeBooks(localIn, remoteIn){
  const local = normalizeBook(clone(localIn)), remote = normalizeBook(clone(remoteIn));
  if(local.resetAt !== remote.resetAt){
    return remote.resetAt > local.resetAt ? {book:remote, reset:'remote'} : {book:local, reset:'local'};
  }
  const out = freshState();
  out.resetAt = local.resetAt;
  out.createdAt = Math.min(local.createdAt, remote.createdAt);
  out.updatedAt = Math.max(local.updatedAt, remote.updatedAt);
  out.tombstones = Object.assign({}, remote.tombstones);
  for(const k in local.tombstones) out.tombstones[k] = Math.max(out.tombstones[k]||0, local.tombstones[k]);
  const localOnly = new Set();
  for(const c of COLLECTIONS){
    const m = new Map();
    for(const r of remote[c]) m.set(r.uid, r);
    for(const r of local[c]){
      const o = m.get(r.uid);
      if(!o){ m.set(r.uid, r); localOnly.add(r.uid); }
      else if((r._u||0) > (o._u||0)) m.set(r.uid, r);
    }
    out[c] = [...m.values()].filter(r=>!out.tombstones[r.uid]);
  }
  for(const k of new Set([...Object.keys(local.seq), ...Object.keys(remote.seq)]))
    out.seq[k] = Math.max(local.seq[k]||0, remote.seq[k]||0);
  out.business = (local.business._u||0) > (remote.business._u||0) ? local.business : remote.business;
  out.reminders = (local.reminders._u||0) > (remote.reminders._u||0) ? local.reminders : remote.reminders;
  repairIds(out, localOnly);
  return {book:normalizeBook(out), reset:null};
}

/* Order-independent fingerprint of everything that syncs, so "is there
   anything new?" never depends on the order fields or records happen to be in. */
function stableStringify(v){
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined ? null : v);
}
function canonical(b){
  const byUid = (x,y)=> x.uid<y.uid ? -1 : x.uid>y.uid ? 1 : 0;
  const pick = {resetAt:b.resetAt||0, createdAt:b.createdAt||0, business:b.business, reminders:b.reminders, seq:b.seq, tombstones:b.tombstones};
  for(const c of COLLECTIONS) pick[c] = [...b[c]].sort(byUid);
  return stableStringify(pick);
}
function wrapBook(book, lastSnapshot){
  return {app:'LoanBook', version:SCHEMA, savedAt:new Date().toISOString(), updatedAt:book.updatedAt||Date.now(), lastSnapshot:lastSnapshot||null, data:book};
}
function extractBook(json){
  if(!json || typeof json!=='object') throw new Error('That is not a LoanBook file.');
  const d = (json.data && typeof json.data==='object') ? json.data : json;
  if(!Array.isArray(d.borrowers) || !Array.isArray(d.loans)) throw new Error('That is not a LoanBook file.');
  return normalizeBook(d);
}

/* =========================== STATE & CACHES =========================== */
let state = null;
let route = '#/dashboard';
let sortState = {}, filterState = {}, charts = {};
let rev = 0, cache = {ledgers:new WeakMap()};
/* Anything derived from the book is cached until the book (or the date) changes. */
function bumpRev(){ rev++; cache = {ledgers:new WeakMap()}; }

/* =========================== LOAN ENGINE =========================== */
/* Rate is a MONTHLY percentage and may be 0. */
const STRUCTURES = {
  'interest-only': {
    label:'Interest monthly, capital at end',
    short:'Interest-only',
    desc:'Borrower pays interest each month and repays the capital with the final month\'s interest. This is the usual arrangement.'
  },
  'equal': {
    label:'Equal monthly instalments',
    short:'Equal instalments',
    desc:'Capital plus total interest divided evenly across every month of the tenor.'
  },
  'reducing': {
    label:'Reducing balance',
    short:'Reducing balance',
    desc:'Equal capital each month, with interest charged only on the balance still outstanding, so the monthly interest falls.'
  }
};
function buildPeriods(principal, monthlyRatePct, structure, months, firstPaymentDate){
  const r = (Number(monthlyRatePct)||0)/100;
  months = Math.max(1, Math.floor(Number(months)||1));
  const periods = [];
  if(structure === 'equal'){
    const totalInterest = Math.round(principal * r * months);
    const total = principal + totalInterest;
    const base = Math.floor(total/months);
    const perInt = Math.floor(totalInterest/months);
    let alloc = 0, intAlloc = 0;
    for(let i=1;i<=months;i++){
      const last = i===months;
      const scheduled = money(last ? total-alloc : base);
      const interest = last ? totalInterest-intAlloc : perInt;   // remainder lands in the last month so the parts add up exactly
      alloc += scheduled; intAlloc += interest;
      periods.push({period:i, interest, capital:money(scheduled-interest), scheduled});
    }
  } else if(structure === 'reducing'){
    const capPer = Math.floor(principal/months);
    let rem = principal;
    for(let i=1;i<=months;i++){
      const interest = Math.round(rem*r);
      const capital = money(i===months ? rem : capPer);
      rem = money(rem - capital);
      periods.push({period:i, interest, capital, scheduled:money(interest+capital)});
    }
  } else {
    for(let i=1;i<=months;i++){
      const interest = Math.round(principal*r);
      const capital = (i===months) ? principal : 0;
      periods.push({period:i, interest, capital, scheduled:money(interest+capital)});
    }
  }
  periods.forEach((p,idx)=>{ p.dueDate = addMonths(firstPaymentDate, idx); });
  return periods;
}
function loanTerms(principal, rate, structure, months, firstPaymentDate){
  const periods = buildPeriods(principal, rate, structure, months, firstPaymentDate);
  return {
    periods,
    interestTotal: money(periods.reduce((s,p)=>s+p.interest,0)),
    totalRepayable: money(periods.reduce((s,p)=>s+p.scheduled,0)),
    finalDueDate: periods.length ? periods[periods.length-1].dueDate : firstPaymentDate
  };
}
function applyTerms(l){
  const t = loanTerms(l.principal, l.rate, l.structure, l.months, l.firstPaymentDate);
  l.schedule = t.periods; l.interestTotal = t.interestTotal; l.totalRepayable = t.totalRepayable; l.finalDueDate = t.finalDueDate;
  return l;
}
function payOrder(a,b){ return a.date===b.date ? (a.timestamp-b.timestamp) : (a.date<b.date ? -1 : 1); }
function paymentsByLoan(){
  if(!cache.pays){
    const m = new Map();
    for(const p of state.payments){ if(!m.has(p.loanId)) m.set(p.loanId, []); m.get(p.loanId).push(p); }
    m.forEach(list=>list.sort(payOrder));
    cache.pays = m;
  }
  return cache.pays;
}
function getLoanPayments(loanId){ return paymentsByLoan().get(loanId) || []; }
/* Balances are derived from the payment ledger every time: money received is
   poured over the schedule oldest-first, so a shortfall rolls forward and an
   overpayment runs into later months without anyone editing the schedule.
   Within a month, interest is settled before capital. */
function computeLedger(loan){
  const hit = cache.ledgers.get(loan);
  if(hit) return hit;
  const pays = getLoanPayments(loan.id);
  const received = money(pays.reduce((s,p)=>s+p.amount,0));
  let remaining = received, overdueAmount = 0, nextDue = null, interestPaid = 0, dueToDate = 0, paidTowardDue = 0;
  const schedule = loan.schedule.map(p=>{
    const allocated = money(Math.max(0, Math.min(remaining, p.scheduled)));
    remaining = money(remaining - allocated);
    const outstanding = money(p.scheduled - allocated);
    interestPaid += Math.min(allocated, p.interest);
    if(p.dueDate <= TODAY){ dueToDate += p.scheduled; paidTowardDue += allocated; }
    let status;
    if(p.scheduled === 0) status = 'No Payment';
    else if(outstanding <= 0) status = 'Paid';
    else if(p.dueDate < TODAY) status = 'Overdue';
    else if(allocated > 0) status = 'Partial';
    else if(p.dueDate === TODAY) status = 'Due Today';
    else status = 'Upcoming';
    if(outstanding > 0 && p.dueDate < TODAY) overdueAmount += outstanding;
    if(outstanding > 0 && !nextDue) nextDue = {date:p.dueDate, amount:outstanding, period:p.period};
    return Object.assign({}, p, {allocated, outstanding, status});
  });
  const totalOutstanding = Math.max(0, money(loan.totalRepayable - received));
  const oldestOverdue = schedule.find(p=>p.status==='Overdue');
  let status;
  if(totalOutstanding <= 0) status = 'Completed';
  else if(oldestOverdue) status = daysBetween(oldestOverdue.dueDate, TODAY) > 90 ? 'Defaulted' : 'Overdue';
  else status = 'Active';
  const capitalRepaid = Math.max(0, Math.min(loan.principal, money(received - interestPaid)));
  const led = {
    schedule, totalPaid:received, totalOutstanding, overdueAmount:money(overdueAmount), nextDue, status,
    interestPaid:money(interestPaid), capitalRepaid,
    capitalOutstanding: status==='Completed' ? 0 : money(loan.principal - capitalRepaid),
    dueToDate:money(dueToDate), paidTowardDue:money(paidTowardDue),
    advanceCredit: Math.max(0, money(received - loan.totalRepayable)),
    pctPaid: Math.min(100, pct(received, loan.totalRepayable)),
    paymentsCount: pays.length
  };
  cache.ledgers.set(loan, led);
  return led;
}
function withLedger(loan){ return Object.assign({}, loan, {ledger:computeLedger(loan)}); }
function allLoans(){ if(!cache.all) cache.all = state.loans.map(withLedger); return cache.all; }
function getBorrower(id){ return state.borrowers.find(b=>b.id===id); }
function getLoan(id){ return state.loans.find(l=>l.id===id); }
function getPayment(id){ return state.payments.find(p=>p.id===id); }
function borrowerLoans(bid){ return allLoans().filter(l=>l.borrowerId===bid); }
function borrowerName(id){ const b=getBorrower(id); return b?b.name:'—'; }
function loanSummary(l){ return `${fmtNaira(l.principal)} at ${l.rate}%/month, ${STRUCTURES[l.structure].short}, ${plural(l.months,'month')} from ${fmtDate(l.startDate)}`; }

/* =========================== MUTATIONS =========================== */
function stamp(rec){ rec._u = Date.now(); return rec; }
function logAudit(action, entity, entityId, detail){
  state.seq.audit = (state.seq.audit||0)+1;
  state.audit.unshift({id:'AUD-'+String(state.seq.audit).padStart(4,'0'), uid:newUid(), action, entity, entityId, detail,
    user:(auth&&auth.username)||'user', timestamp:Date.now()});
  if(state.audit.length > AUDIT_CAP) state.audit.length = AUDIT_CAP;
}
function removeRecords(coll, recs){
  if(!recs.length) return;
  const now = Date.now(), uids = new Set(recs.map(r=>r.uid));
  recs.forEach(r=>{ state.tombstones[r.uid] = now; });
  state[coll] = state[coll].filter(r=>!uids.has(r.uid));
}
const BORROWER_FIELDS = ['phone','email','address','idType','idNumber','guarantor','employment','bankInfo'];
const FIELD_LABELS = {name:'name', phone:'phone', email:'email', address:'address', idType:'ID type', idNumber:'ID number', guarantor:'guarantor', employment:'work', bankInfo:'bank details'};
function addBorrower(data, opts){
  opts = opts||{};
  const b = {id:makeBorrowerIdIn(state, data.name), uid:newUid(), _u:Date.now(), name:String(data.name).trim().replace(/\s+/g,' ')};
  BORROWER_FIELDS.forEach(k=>{ b[k] = String(data[k]||'').trim(); });
  b.dateAdded = data.dateAdded || TODAY;
  state.borrowers.push(b);
  logAudit('Borrower added','Borrower',b.id,`${b.name} added to the register`);
  if(!opts.silent) save();
  return b;
}
function updateBorrower(id, data){
  const b = getBorrower(id); if(!b) return;
  const changed = [];
  const name = String(data.name).trim().replace(/\s+/g,' ');
  if(name && name!==b.name){ changed.push(`name ${b.name} → ${name}`); b.name = name; }
  BORROWER_FIELDS.forEach(k=>{ const v = String(data[k]||'').trim(); if(v!==b[k]){ changed.push(FIELD_LABELS[k]); b[k] = v; } });
  if(!changed.length) return false;
  stamp(b);
  logAudit('Borrower updated','Borrower',b.id,`${b.name}: changed ${changed.join(', ')}`);
  save();
  return true;
}
function deleteBorrower(id){
  const b = getBorrower(id); if(!b) return;
  if(state.loans.some(l=>l.borrowerId===id)) throw new Error('This borrower still has loans.');
  removeRecords('notes', state.notes.filter(n=>n.borrowerId===id));
  removeRecords('borrowers', [b]);
  logAudit('Borrower deleted','Borrower',id,`${b.name} removed from the register`);
  save();
}
function addLoan(data, opts){
  opts = opts||{};
  const loan = {
    id:nextIdIn(state,'loans'), uid:newUid(), _u:Date.now(), borrowerId:data.borrowerId, principal:money(data.principal),
    rate:Number(data.rate)||0, structure:data.structure, months:data.months,
    startDate:data.startDate, firstPaymentDate:data.firstPaymentDate,
    purpose:data.purpose||'', createdDate:data.createdDate||TODAY
  };
  applyTerms(loan);
  state.loans.push(loan);
  logAudit('Loan created','Loan',loan.id,`${loanSummary(loan)} to ${borrowerName(loan.borrowerId)}`);
  if(!opts.silent) save();
  return loan;
}
function updateLoan(id, data){
  const l = getLoan(id); if(!l) return;
  const before = loanSummary(l), beforeBorrower = l.borrowerId;
  Object.assign(l, {borrowerId:data.borrowerId, principal:money(data.principal), rate:Number(data.rate)||0, structure:data.structure,
    months:data.months, startDate:data.startDate, firstPaymentDate:data.firstPaymentDate, purpose:data.purpose||''});
  applyTerms(l); stamp(l);
  const moved = beforeBorrower !== l.borrowerId;
  if(moved) state.payments.filter(p=>p.loanId===id).forEach(p=>{ p.borrowerId = l.borrowerId; stamp(p); });
  const after = loanSummary(l);
  logAudit('Loan updated','Loan',id, (before!==after ? `${before} → ${after}` : 'Details updated') + (moved ? `; moved from ${borrowerName(beforeBorrower)} to ${borrowerName(l.borrowerId)}` : ''));
  save();
}
function deleteLoan(id){
  const l = getLoan(id); if(!l) return;
  const pays = state.payments.filter(p=>p.loanId===id);
  const total = pays.reduce((s,p)=>s+p.amount,0);
  removeRecords('payments', pays);
  removeRecords('notes', state.notes.filter(n=>n.loanId===id));
  removeRecords('loans', [l]);
  logAudit('Loan deleted','Loan',id,`${loanSummary(l)} for ${borrowerName(l.borrowerId)} deleted` + (pays.length ? `, with ${plural(pays.length,'payment')} totalling ${fmtNaira(total)}` : ''));
  save();
}
function addPayment(data, opts){
  opts = opts||{};
  const p = {
    id:nextIdIn(state,'payments'), uid:newUid(), _u:Date.now(), loanId:data.loanId, borrowerId:data.borrowerId, date:data.date,
    amount:money(data.amount), method:data.method||'Other', reference:data.reference||'', notes:data.notes||'',
    timestamp: data.timestamp || Date.now()
  };
  state.payments.push(p);
  logAudit('Payment recorded','Payment',p.id,`${fmtNaira(p.amount)} on ${p.loanId} from ${borrowerName(p.borrowerId)} via ${p.method}, dated ${fmtDate(p.date)}`);
  if(!opts.silent) save();
  return p;
}
function updatePayment(id, data){
  const p = getPayment(id); if(!p) return;
  const before = `${fmtNaira(p.amount)} on ${fmtDate(p.date)} to ${p.loanId}`;
  Object.assign(p, {loanId:data.loanId, borrowerId:data.borrowerId, date:data.date, amount:money(data.amount), method:data.method||'Other', reference:data.reference||'', notes:data.notes||''});
  stamp(p);
  const after = `${fmtNaira(p.amount)} on ${fmtDate(p.date)} to ${p.loanId}`;
  logAudit('Payment updated','Payment',id, before===after ? 'Method, reference or note changed' : `${before} → ${after}`);
  save();
}
function deletePayment(id){
  const p = getPayment(id); if(!p) return;
  removeRecords('payments', [p]);
  logAudit('Payment deleted','Payment',id,`${fmtNaira(p.amount)} dated ${fmtDate(p.date)} on ${p.loanId} from ${borrowerName(p.borrowerId)} deleted`);
  save();
}
function addNote(data, opts){
  opts = opts||{};
  const n = {id:nextIdIn(state,'notes'), uid:newUid(), _u:Date.now(), borrowerId:data.borrowerId||null, loanId:data.loanId||null, text:data.text, createdAt:data.createdAt||Date.now()};
  state.notes.unshift(n);
  logAudit('Note added', data.loanId?'Loan':'Borrower', data.loanId||data.borrowerId, n.text.slice(0,70));
  if(!opts.silent) save();
  return n;
}
function deleteNote(uid){
  const n = state.notes.find(x=>x.uid===uid); if(!n) return;
  removeRecords('notes', [n]);
  logAudit('Note deleted', n.loanId?'Loan':'Borrower', n.loanId||n.borrowerId, n.text.slice(0,70));
  save();
}
