/* =========================== BACKUP =========================== */
function exportBackup(){
  const payload = {app:'LoanBook', version:2, exportedAt:new Date().toISOString(), data:state};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const name = `loanbook-backup-${TODAY}.json`;
  triggerDownload(blob, name);
  state.lastBackup = Date.now();
  save();
  toast('Backup downloaded — keep it in your Drive folder');
  if(route==='#/settings') rerender('settings');
}
function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const data = parsed.data || parsed;
      if(!data || !Array.isArray(data.borrowers) || !Array.isArray(data.loans)) throw new Error('That file is not a LoanBook backup.');
      openModal(`<div class="modal-head"><h3>Restore this backup?</h3><button class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
        <div class="modal-body"><p style="font-size:13.5px;">The backup holds <b>${data.borrowers.length}</b> borrowers, <b>${data.loans.length}</b> loans and <b>${(data.payments||[]).length}</b> payments${parsed.exportedAt?`, saved ${fmtDate(parsed.exportedAt.slice(0,10))}`:''}.</p>
        <p style="font-size:13.5px;">Restoring replaces everything currently on this device.</p></div>
        <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick='doRestore(${JSON.stringify(JSON.stringify(data))})'>Restore</button></div>`);
    }catch(e){ toast(e.message||'Could not read that file','error'); }
    input.value = '';
  };
  reader.readAsText(file);
}
function doRestore(json){
  try{
    const data = JSON.parse(json);
    const f = freshState();
    for(const k in f){ if(data[k] === undefined) data[k] = f[k]; }
    state = data;
    logAudit('Backup restored','Data','—',`Restored ${state.borrowers.length} borrowers and ${state.loans.length} loans`);
    save(); closeModal(); toast('Backup restored'); navigate('#/dashboard');
  }catch(e){ toast('Could not restore that backup','error'); }
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  triggerDownload(new Blob([csv],{type:'text/csv;charset=utf-8;'}), filename);
  toast('Exported '+filename);
}
function exportLoansCSV(){
  const rows = [['Loan','Borrower','Borrower ID','Capital','Rate %/month','Structure','Months','Start','First payment','Final due','Interest','Total repayable','Paid','Outstanding','Overdue','Status']];
  allLoans().forEach(l=>{ const b=getBorrower(l.borrowerId);
    rows.push([l.id,b?b.name:'',l.borrowerId,l.principal,l.rate,STRUCTURES[l.structure].short,l.months,l.startDate,l.firstPaymentDate,l.finalDueDate,l.interestTotal,l.totalRepayable,l.ledger.totalPaid,l.ledger.totalOutstanding,l.ledger.overdueAmount,l.ledger.status]); });
  downloadCSV('loan-book.csv', rows);
}
function exportPaymentsCSV(){
  const rows = [['Payment','Date','Borrower','Borrower ID','Loan','Amount','Method','Reference','Note']];
  [...state.payments].sort((a,b)=>a.timestamp-b.timestamp).forEach(p=>{ const b=getBorrower(p.borrowerId);
    rows.push([p.id,p.date,b?b.name:'',p.borrowerId,p.loanId,p.amount,p.method,p.reference,p.notes]); });
  downloadCSV('payments.csv', rows);
}

    <h4>Repayment schedule</h4>
    <table><thead><tr><th>Month</th><th>Due date</th><th class="num">Interest</th><th class="num">Capital</th><th class="num">Amount due</th></tr></thead><tbody>

    <div class="letter-sign">

  openModal(`<div class="modal-head"><h3>Confirmation letter</h3><button class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
    <div class="modal-body" style="background:var(--surface-2);">
      ${!state.business.name?`<div class="callout" style="margin-bottom:14px;">Add your business name and signatory under <b>Settings → Letterhead</b> so they appear on the letter.</div>`:''}
      <div style="background:#fff;border:1px solid var(--border);border-radius:8px;">${letterHTML(loan)}</div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="printLetter('${loan.id}')">${icon('print')} Print / save as PDF</button></div>`, {wide:true});
}
function printLetter(loanId){
  const loan = getLoan(loanId);
  document.getElementById('printArea').innerHTML = letterHTML(loan);
  document.body.classList.add('print-letter');
  window.print();
  setTimeout(()=>{ document.body.classList.remove('print-letter'); document.getElementById('printArea').innerHTML=''; }, 500);
}

/* =========================== MODALS =========================== */
function openModal(html, opts){
  opts = opts||{};
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()"><div class="modal-box ${opts.wide?'wide':''}">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function closeIcon(){ return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

function openBorrowerModal(){
  openModal(`<form onsubmit="return submitBorrower(event)">
    <div class="modal-head"><h3>Add borrower</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full"><label>Full name <span class="req">*</span></label><input class="input" name="name" required autofocus>
          <span class="hint">Their reference is made from this name, e.g. Amaka Osu becomes AO-001.</span></div>
        <div class="form-field"><label>Phone</label><input class="input" name="phone" placeholder="0803 123 4567"></div>
        <div class="form-field"><label>Email</label><input class="input" type="email" name="email"></div>
        <div class="form-field full"><label>Address</label><input class="input" name="address"></div>
      </div>
      <div class="fieldset-legend">Optional</div>
      <div class="form-grid">
        <div class="form-field"><label>ID type</label><select class="select" name="idType"><option value="">—</option><option>National ID (NIN)</option><option>Voter's Card</option><option>Driver's License</option><option>International Passport</option></select></div>
        <div class="form-field"><label>ID number</label><input class="input" name="idNumber"></div>
        <div class="form-field"><label>Guarantor</label><input class="input" name="guarantor" placeholder="Who vouched for them"></div>
        <div class="form-field"><label>Work or business</label><input class="input" name="employment"></div>
        <div class="form-field full"><label>Bank details</label><input class="input" name="bankInfo" placeholder="Bank · account number"></div>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Add borrower</button></div></form>`);
}
function submitBorrower(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  if(!d.name || !d.name.trim()){ toast('A name is required','error'); return false; }
  const b = addBorrower(d);
  closeModal(); toast(`${b.name} added as ${b.id}`);
  navigate('#/borrowers/'+b.id);
  return false;
}

function openLoanModal(borrowerId){
  if(!state.borrowers.length){ toast('Add a borrower first','error'); openBorrowerModal(); return; }
  const opts = state.borrowers.map(b=>`<option value="${b.id}" ${b.id===borrowerId?'selected':''}>${esc(b.name)} (${b.id})</option>`).join('');
  openModal(`<form onsubmit="return submitLoan(event)">
    <div class="modal-head"><h3>New loan</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full"><label>Borrower <span class="req">*</span></label><select class="select" name="borrowerId" required>${opts}</select>
          <span class="hint">A borrower can hold as many loans as you like — they all stay under the same reference.</span></div>
        <div class="form-field"><label>Amount given <span class="req">*</span></label><input class="input" type="number" min="1" step="1" name="principal" id="lnP" required oninput="previewLoan()" placeholder="500000"></div>
        <div class="form-field"><label>Interest rate <span class="req">*</span></label>
          <input class="input" type="number" min="0" step="0.25" name="rate" id="lnR" required value="5" oninput="previewLoan()">
          <span class="hint">Per month. Enter 0 for an interest-free loan.</span></div>
        <div class="form-field"><label>Tenor (months) <span class="req">*</span></label><input class="input" type="number" min="1" max="60" step="1" name="months" id="lnM" required value="1" oninput="previewLoan()"></div>
        <div class="form-field"><label>Date given <span class="req">*</span></label><input class="input" type="date" name="startDate" id="lnS" required value="${TODAY}" onchange="syncFirstPayment()"></div>
        <div class="form-field full"><label>First payment due <span class="req">*</span></label><input class="input" type="date" name="firstPaymentDate" id="lnF" required onchange="previewLoan()"></div>
      </div>
      <div class="fieldset-legend">How it is repaid</div>
      <div class="struct-pick" id="lnStruct">
        ${Object.keys(STRUCTURES).map((k,i)=>`<label class="struct-opt ${i===0?'sel':''}" onclick="pickStructure('${k}')">
          <input type="radio" name="structure" value="${k}" ${i===0?'checked':''}>
          <span><span class="so-title">${STRUCTURES[k].label}</span><span class="so-desc">${STRUCTURES[k].desc}</span></span></label>`).join('')}
      </div>
      <div class="calc-preview" id="lnPrev"></div>
      <div class="form-field full" style="margin-top:14px;"><label>What it is for</label><input class="input" name="purpose" placeholder="e.g. Restock inventory"></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Create loan</button></div></form>`, {wide:true});
  syncFirstPayment();
}
function pickStructure(k){
  document.querySelectorAll('#lnStruct .struct-opt').forEach(el=>el.classList.remove('sel'));
  const input = document.querySelector(`#lnStruct input[value="${k}"]`);
  input.checked = true;
  input.closest('.struct-opt').classList.add('sel');
  previewLoan();
}
function syncFirstPayment(){
  const s = document.getElementById('lnS').value || TODAY;
  document.getElementById('lnF').value = addMonths(s,1);
  previewLoan();
}
function previewLoan(){
  const p = parseFloat(document.getElementById('lnP').value)||0;
  const r = parseFloat(document.getElementById('lnR').value)||0;
  const m = parseInt(document.getElementById('lnM').value)||0;
  const f = document.getElementById('lnF').value || TODAY;
  const st = (document.querySelector('#lnStruct input:checked')||{}).value || 'interest-only';
  const box = document.getElementById('lnPrev');
  if(!p || !m){ box.innerHTML = `<div style="grid-column:1/-1;" class="shint">Enter an amount and tenor to see the schedule.</div>`; return; }
  const t = loanTerms(p, r, st, m, f);
  const first = t.periods[0], last = t.periods[t.periods.length-1];
  box.innerHTML = `
    <div><div class="cp-label">Total interest</div><div class="cp-value">${fmtNaira(t.interestTotal)}</div></div>
    <div><div class="cp-label">Total repayable</div><div class="cp-value">${fmtNaira(t.totalRepayable)}</div></div>
    <div><div class="cp-label">${st==='interest-only'&&m>1?'Monthly interest':'First payment'}</div><div class="cp-value">${fmtNaira(first.scheduled)}</div></div>
    <div><div class="cp-label">Final payment ${fmtDate(last.dueDate)}</div><div class="cp-value">${fmtNaira(last.scheduled)}</div></div>`;
}
function submitLoan(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  d.principal = parseFloat(d.principal); d.rate = parseFloat(d.rate)||0; d.months = parseInt(d.months);
  if(!d.borrowerId || !(d.principal>0) || !(d.months>0)){ toast('Check the amount and tenor','error'); return false; }
  const loan = addLoan(d);
  closeModal();
  toast(`${loan.id} created — ${loan.months} month schedule ready`);
  navigate('#/loans/'+loan.id);
  return false;
}

function openRecordPaymentModal(borrowerId, loanId){
  if(!state.loans.length){ toast('Create a loan first','error'); return; }
  const opts = state.borrowers.map(b=>`<option value="${b.id}" ${b.id===borrowerId?'selected':''}>${esc(b.name)} (${b.id})</option>`).join('');
  openModal(`<form onsubmit="return submitPayment(event)">
    <div class="modal-head"><h3>Record payment</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field"><label>Borrower <span class="req">*</span></label><select class="select" name="borrowerId" id="pyB" required onchange="syncLoanOptions()">${opts}</select></div>
        <div class="form-field"><label>Loan <span class="req">*</span></label><select class="select" name="loanId" id="pyL" required onchange="previewPayment()"></select></div>
        <div class="form-field"><label>Amount <span class="req">*</span></label><input class="input" type="number" min="1" step="1" name="amount" id="pyA" required oninput="previewPayment()"></div>
        <div class="form-field"><label>Date <span class="req">*</span></label><input class="input" type="date" name="date" required value="${TODAY}"></div>
        <div class="form-field"><label>Method <span class="req">*</span></label><select class="select" name="method" required><option>Bank Transfer</option><option>Cash</option><option>POS</option><option>Direct Debit</option><option>Other</option></select></div>
        <div class="form-field"><label>Reference</label><input class="input" name="reference" placeholder="Teller or receipt no."></div>
        <div class="form-field full"><label>Note</label><textarea class="textarea" name="notes" placeholder="Anything worth remembering about this payment"></textarea></div>
      </div>
      <div class="calc-preview" id="pyPrev"></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Record payment</button></div></form>`);
  syncLoanOptions(loanId);
}
function syncLoanOptions(preselect){
  const bid = document.getElementById('pyB').value;
  const loans = state.loans.filter(l=>l.borrowerId===bid).map(withLedger);
  const sel = document.getElementById('pyL');
  sel.innerHTML = loans.length
    ? loans.map(l=>`<option value="${l.id}" ${l.id===preselect?'selected':''}>${l.id} — ${fmtNaira(l.ledger.totalOutstanding)} owed${l.ledger.status==='Completed'?' (settled)':''}</option>`).join('')
    : `<option value="">No loans for this borrower</option>`;
  previewPayment();
}
function previewPayment(){
  const loan = getLoan(document.getElementById('pyL').value);
  const box = document.getElementById('pyPrev');
  if(!loan){ box.innerHTML=''; return; }
  const led = computeLedger(loan);
  const amt = parseFloat(document.getElementById('pyA').value)||0;
  const after = led.totalOutstanding - amt;
  box.innerHTML = `
    <div><div class="cp-label">Owed now</div><div class="cp-value">${fmtNaira(led.totalOutstanding)}</div></div>
    <div><div class="cp-label">Of that, overdue</div><div class="cp-value" style="${led.overdueAmount>0?'color:var(--red);':''}">${fmtNaira(led.overdueAmount)}</div></div>
    <div><div class="cp-label">${after<0?'Paid ahead by':'Owed after this'}</div><div class="cp-value" style="color:var(--accent);">${fmtNaira(Math.abs(after))}</div></div>
    <div><div class="cp-label">Next due</div><div class="cp-value">${led.nextDue?fmtDate(led.nextDue.date):'—'}</div></div>`;
}
function submitPayment(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  d.amount = parseFloat(d.amount);
  if(!d.loanId || !(d.amount>0)){ toast('Pick a loan and enter an amount','error'); return false; }
  const loan = getLoan(d.loanId);
  addPayment(d);
  const after = computeLedger(loan);
  closeModal();
  if(after.status==='Completed') toast(`${fmtNaira(d.amount)} recorded — ${loan.id} is fully repaid`);
  else if(after.overdueAmount>0) toast(`${fmtNaira(d.amount)} recorded — ${fmtNaira(after.overdueAmount)} still overdue`);
  else toast(`${fmtNaira(d.amount)} recorded — ${fmtNaira(after.totalOutstanding)} left on this loan`);
  navigate('#/loans/'+loan.id);
  return false;
}

function openNoteModal(ctx){
  openModal(`<form onsubmit="return submitNote(event,'${ctx.borrowerId||''}','${ctx.loanId||''}')">
    <div class="modal-head"><h3>Add note</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
    <div class="modal-body"><div class="form-field full"><label>Note</label><textarea class="textarea" name="text" required autofocus placeholder="e.g. Asked to move the payment date to the 5th"></textarea></div></div>
    <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save note</button></div></form>`);
}
function submitNote(e, borrowerId, loanId){
  e.preventDefault();
  const text = new FormData(e.target).get('text');
  if(!text || !text.trim()) return false;
  addNote({borrowerId:borrowerId||null, loanId:loanId||null, text:text.trim()});
  closeModal(); toast('Note saved'); render();
  return false;
}

/* =========================== SEARCH / PANELS / TOAST =========================== */
function onGlobalSearch(q){
  const root = document.getElementById('searchResults');
  if(!q || !q.trim()){ root.innerHTML=''; root.className=''; return; }
  root.className = 'search-results';
  const ql = q.toLowerCase(), out = [];
  state.borrowers.forEach(b=>{ if(b.name.toLowerCase().includes(ql)||(b.phone||'').includes(ql)||b.id.toLowerCase().includes(ql))
    out.push({t:b.name, m:`Borrower · ${b.id} · ${b.phone||'no phone'}`, go:`#/borrowers/${b.id}`}); });
  state.loans.forEach(l=>{ if(l.id.toLowerCase().includes(ql)||borrowerName(l.borrowerId).toLowerCase().includes(ql))
    out.push({t:l.id, m:`Loan · ${borrowerName(l.borrowerId)} · ${fmtNaira(l.principal)}`, go:`#/loans/${l.id}`}); });
  state.payments.forEach(p=>{ if((p.reference||'').toLowerCase().includes(ql))
    out.push({t:p.reference, m:`Payment · ${fmtNaira(p.amount)} · ${borrowerName(p.borrowerId)}`, go:`#/loans/${p.loanId}`}); });
  root.innerHTML = out.length
    ? out.slice(0,8).map(r=>`<div class="sr-item" onmousedown="navigate('${r.go}'); document.getElementById('globalSearch').value=''; document.getElementById('searchResults').innerHTML='';"><div class="sr-title">${esc(r.t)}</div><div class="sr-meta">${esc(r.m)}</div></div>`).join('')
    : `<div class="sr-empty">Nothing matches “${esc(q)}”</div>`;
}
function toggleNotifPanel(e){
  e.stopPropagation();
  const root = document.getElementById('notifPanelRoot');
  if(root.innerHTML){ root.innerHTML=''; return; }
  const items = buildAlerts().slice(0,9);
  root.innerHTML = `<div class="notif-panel" onmousedown="event.stopPropagation()">
    <div class="notif-panel-head">Alerts</div>
    <div class="notif-list">${items.length ? items.map(n=>`<div class="notif-item"><span class="notif-dotcolor" style="background:${n.color};"></span><div><div class="notif-text">${n.text}</div><div class="notif-time">${fmtDate(n.time)}</div></div></div>`).join('') : `<div class="sr-empty">Nothing needs chasing.</div>`}</div>
  </div>`;
}
function updateNotifDot(){
  const n = buildAlerts().filter(a=>a.type==='overdue'||a.type==='due').length;
  const dot = document.getElementById('notifDot');
  if(dot) dot.style.display = n ? 'block' : 'none';
}
document.addEventListener('click', closePanels);
function closePanels(){
  const p=document.getElementById('notifPanelRoot'); if(p) p.innerHTML='';
  const s=document.getElementById('searchResults'); if(s) s.innerHTML='';
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarBackdrop').classList.toggle('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3800);
}

/* =========================== AUTH SCREENS =========================== */
function authShellHTML(inner){
  return `<div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>
      <div><div class="bn">LoanBook</div><div class="bs">Portfolio Ledger</div></div>
    </div>${inner}</div>`;
}
function googleLogo(){
  return `<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7c4.1-3.8 6.6-9.4 6.6-16.3z"/><path fill="#34A853" d="M24 46c5.8 0 10.7-1.9 14.3-5.2l-7-5.5c-1.9 1.3-4.4 2.1-7.3 2.1-5.6 0-10.4-3.8-12.1-8.9H4.7v5.7C8.3 41.4 15.6 46 24 46z"/><path fill="#FBBC05" d="M11.9 28.5c-.4-1.3-.7-2.7-.7-4.5s.3-3.2.7-4.5v-5.7H4.7C3.1 17 2 20.4 2 24s1.1 7 2.7 10.2l7.2-5.7z"/><path fill="#EA4335" d="M24 10.6c3.2 0 6 1.1 8.2 3.2l6.2-6.2C34.7 4.1 29.8 2 24 2 15.6 2 8.3 6.6 4.7 13.8l7.2 5.7c1.7-5.1 6.5-8.9 12.1-8.9z"/></svg>`;
}
function googleButton(label){
  return `<button type="button" class="gbtn" id="gBtn" onclick="doGoogleSignIn()">${googleLogo()}<span>${label}</span></button>`;
}
async function doGoogleSignIn(){
  const btn = document.getElementById('gBtn');
  const err = document.getElementById('authErr');
  if(btn){ btn.disabled = true; btn.querySelector('span').textContent = 'Connecting…'; }
  try{
    await signInWithGoogle();
    startApp();
  }catch(ex){
    if(err) err.innerHTML = `<div class="auth-error">${esc(ex.message)}</div>`;
    if(btn){ btn.disabled = false; btn.querySelector('span').textContent = 'Continue with Google'; }
  }
}
function showSignIn(msg){
  const auth = readAuth()||{};
  const returning = !!auth.email;
  const ready = googleReady();
  document.getElementById('authScreen').innerHTML = authShellHTML(`
    <h2>${returning ? 'Welcome back' : 'Sign in to your book'}</h2>
    <p class="auth-sub">${returning
      ? 'Your book is in your Google Drive. Sign in to open it.'
      : 'Sign in with Google. Your book is kept in your own Google Drive, so it is safe if this computer is lost and it is the same book on your phone.'}</p>
    <div id="authErr">${msg?`<div class="auth-error">${esc(msg)}</div>`:''}</div>
    ${googleButton(returning ? 'Continue as '+esc(auth.email) : 'Continue with Google')}
    ${ready ? '' : `<p class="auth-note">Google sign-in has not loaded. Check your internet connection and reload the page.</p>`}
    <p class="auth-note">LoanBook only ever sees the one file it creates in your Drive — nothing else you keep there.</p>`);
}

/* =========================== BOOT =========================== */
function startApp(){
  const auth = readAuth()||{};
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('shell').classList.add('ready');
  document.getElementById('userAvatar').textContent = initials(auth.username||'U');
  document.getElementById('userName').textContent = auth.username||'—';
  route = location.hash || '#/dashboard';
  render();
  renderSyncBadge();
}
async function boot(){
  await waitForGoogle(6000);
  if(!readAuth() || !googleReady()){ showSignIn(); return; }
  /* Returning to a device that has already been granted access: take the
     token quietly and open the book, rather than making them click again. */
  try{
    await requestToken(true);
    try{ loadVault(); }catch(e){ state = freshState(); }
    if(!state) state = freshState();
    startApp();
    syncOnSignIn().catch(e=>console.error(e));
  }catch(e){ showSignIn(); }
}
/* Coming back to the tab on another device should pick up what changed. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && isSignedIn() && googleReady() && state){
    syncOnSignIn().then(r=>{ if(r === 'pulled'){ render(); toast('Updated from Drive'); } }).catch(()=>{});
  }
});
boot();
</script>
