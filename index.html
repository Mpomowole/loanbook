<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#F4F7FC;
  --surface:#FFFFFF;
  --surface-2:#EDF2FA;
  --surface-3:#E0E9F6;
  --ink:#0F1D33;
  --ink-soft:#4C5C77;
  --ink-faint:#8B99B2;
  --border:#DCE5F3;
  --border-strong:#C1D0E7;
  --accent:#2158A6;
  --accent-strong:#153E7B;
  --accent-soft:#E3ECFB;
  --gold:#A9781F;
  --gold-soft:#F4E9D2;
  --red:#AD2E3E;
  --red-soft:#F7E3E5;
  --teal:#0E7C86;
  --teal-soft:#DFF1F2;
  --sidebar-bg:#0F2148;
  --sidebar-bg-2:#0A1830;
  --sidebar-text:#DCE6F7;
  --sidebar-text-dim:#7C92BB;
  --sidebar-active:#1C3B72;
  --shadow-sm:0 1px 2px rgba(15,29,51,0.06);
  --shadow-md:0 4px 16px rgba(15,29,51,0.08);
  --shadow-lg:0 12px 32px rgba(15,29,51,0.14);
  --radius-md:10px;
  --radius-lg:12px;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:700;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-0.01em;}
h1{font-size:22px;} h3{font-size:15px;}
a{color:var(--accent);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

/* ============ AUTH ============ */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
.auth-card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;box-shadow:var(--shadow-md);}
.auth-brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;}
.auth-brand svg{width:24px;height:24px;stroke:var(--accent);}
.auth-brand .bn{font-size:19px;font-weight:700;}
.auth-brand .bs{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-top:1px;}
.auth-card h2{font-size:17px;margin-bottom:5px;}
.auth-card .auth-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.auth-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.auth-field input{padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:15px;font-family:var(--font-body);}
.auth-field input:focus{border-color:var(--accent);outline:none;}
.auth-error{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.auth-note{font-size:11.5px;color:var(--ink-faint);margin-top:16px;line-height:1.5;}
.auth-submit{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.auth-submit:hover{background:var(--accent-strong);}
.auth-submit:disabled{opacity:0.6;cursor:wait;}

/* ============ SHELL ============ */
#shell{display:none;min-height:100vh;}
#shell.ready{display:flex;}
#sidebar{width:230px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 18px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,0.08);}
.brand-mark{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark svg{width:21px;height:21px;stroke:#fff;}
.brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:0.2px;}
.brand-sub{font-size:10px;color:var(--sidebar-text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:1px;}
nav.mainnav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text-dim);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;position:relative;}
.navlink svg{width:17px;height:17px;stroke:currentColor;flex:none;}
.navlink:hover{background:rgba(255,255,255,0.05);color:var(--sidebar-text);}
.navlink.active{background:var(--sidebar-active);color:#fff;}
.navlink .badge-count{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:var(--font-mono);}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:9px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#241b06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
.user-name{color:#fff;font-size:12.5px;font-weight:600;}
.signout{background:none;border:none;color:var(--sidebar-text-dim);font-size:11px;cursor:pointer;padding:0;text-align:left;}
.signout:hover{color:#fff;text-decoration:underline;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;flex:1;max-width:400px;}
.search-input{width:100%;padding:9px 14px 9px 36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13.5px;font-family:var(--font-body);}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-faint);pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:50;}
.sr-item{display:flex;flex-direction:column;gap:1px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--surface-2);}
.sr-title{font-size:13px;font-weight:600;}
.sr-meta{font-size:11.5px;color:var(--ink-soft);}
.sr-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface);}
.notif-panel{position:absolute;top:56px;right:26px;width:350px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;}
.notif-list{max-height:380px;overflow-y:auto;}
.notif-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-dotcolor{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
.notif-text{font-size:12.5px;line-height:1.45;}
.notif-time{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.menu-toggle{display:none;}
#sidebarBackdrop{display:none;}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.gbtn:hover{background:var(--surface-2);}
.gbtn:disabled{opacity:0.6;cursor:wait;}
.gbtn svg{width:18px;height:18px;}

#app{flex:1;padding:24px 26px 60px;max-width:1380px;width:100%;margin:0 auto;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:5px;max-width:580px;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
.btn svg{width:15px;height:15px;stroke:currentColor;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-danger{color:var(--red);border-color:var(--border-strong);}
.btn-danger:hover{background:var(--red-soft);}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:18px;overflow:hidden;}
.kpi-card{background:var(--surface);padding:15px 18px;}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-soft);font-weight:600;}
.kpi-value{font-size:21px;font-weight:600;margin-top:6px;color:var(--ink);}
.kpi-value.mono{font-family:var(--font-mono);font-size:18px;}
.kpi-value.warn{color:var(--gold);}
.kpi-value.danger{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.mini-row{display:flex;flex-wrap:wrap;column-gap:26px;row-gap:6px;padding:2px 2px 16px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.mini-card{display:flex;align-items:baseline;gap:8px;}
.mini-card .mc-label{font-size:12.5px;color:var(--ink-soft);}
.mini-card .mc-value{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--ink);}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:19px 21px;margin-bottom:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.shint{font-size:11.5px;color:var(--ink-faint);}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:1080px){.grid-2{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);}}

.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-soft);padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;}
thead th.sortable{cursor:pointer;user-select:none;}
tbody td{padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.rowlink{cursor:pointer;}
tbody tr.rowlink:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.cell-primary{font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.input,select.select,textarea.textarea{padding:8px 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-family:var(--font-body);}
select.select{padding:8px 28px 8px 11px;}
textarea.textarea{width:100%;resize:vertical;min-height:62px;}
.input:focus,select.select:focus,textarea.textarea:focus{border-color:var(--accent);}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;color:var(--ink-soft);}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.badge-active{color:var(--accent);}
.badge-paid{color:var(--teal);}
.badge-completed{color:var(--teal);}
.badge-partial{color:var(--gold);}
.badge-upcoming{color:var(--ink-faint);}
.badge-duetoday{color:var(--gold);}
.badge-overdue{color:var(--red);}
.badge-defaulted{color:var(--red);}
.badge-nopayment{color:var(--ink-faint);}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:19px 21px;}
.chart-box{position:relative;height:225px;}

.progress-track{height:9px;background:var(--surface-3);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width 0.4s ease;}
.progress-fill.red{background:var(--red);}
.progress-fill.teal{background:var(--teal);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,0.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:36px 20px;overflow-y:auto;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.modal-box.wide{max-width:780px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 21px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:17px;}
.modal-body{padding:19px 21px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:15px 21px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.close-x svg{width:15px;height:15px;stroke:currentColor;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.form-field .hint{font-size:10.5px;color:var(--ink-faint);}
.form-field .req{color:var(--red);}
.fieldset-legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);margin:18px 0 10px;padding-top:14px;border-top:1px dashed var(--border);}
.fieldset-legend:first-child{margin-top:0;padding-top:0;border-top:none;}
.calc-preview{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;}
.cp-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
.cp-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:2px;}
.struct-pick{display:flex;flex-direction:column;gap:8px;}
.struct-opt{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;cursor:pointer;align-items:flex-start;}
.struct-opt:hover{background:var(--surface-2);}
.struct-opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.struct-opt input{margin-top:3px;}
.struct-opt .so-title{font-size:13px;font-weight:600;}
.struct-opt .so-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

#toastRoot{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-lg);max-width:340px;}
.toast.error{border-left:3px solid var(--red);}

.detail-header{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;}
.avatar-lg{width:52px;height:52px;border-radius:13px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none;}
.detail-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.detail-meta-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-soft);}
.stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin:16px 0;}
.st{background:var(--surface);padding:13px 16px;}
.st-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;font-weight:600;}
.st-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:4px;}
@media(max-width:1080px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
.notes-list{display:flex;flex-direction:column;gap:10px;}
.note-item{background:var(--surface-2);border-radius:9px;padding:11px 13px;}
.note-text{font-size:13px;line-height:1.5;}
.note-meta{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.audit-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-item:last-child{border-bottom:none;}
.audit-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
.audit-time{color:var(--ink-faint);font-size:11px;}
.empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint);}
.empty-state svg{width:34px;height:34px;stroke:var(--ink-faint);margin-bottom:10px;}
.empty-state p{font-size:13px;margin:0 0 14px;}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.report-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;text-align:left;}
.report-tile:hover{border-color:var(--accent);}
.report-tile.active{border-color:var(--accent);background:var(--accent-soft);}
.report-tile h4{font-size:13.5px;margin-bottom:3px;}
.report-tile p{font-size:11.5px;color:var(--ink-soft);margin:0;}
@media(max-width:1080px){.report-grid{grid-template-columns:1fr 1fr;}}
.statement-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:15px;border-bottom:2px solid var(--ink);margin-bottom:15px;}
.statement-figs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.sf-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;}
.sf-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:3px;}
.set-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.set-row:last-child{border-bottom:none;}
.set-label{font-size:13px;font-weight:600;}
.set-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;max-width:520px;}

<script>
/* =========================================================================
   LoanBook — single-user loan ledger for short-term soft loans.
   Interest is a MONTHLY rate set per loan (may be 0%). Three repayment
   structures are supported; balances are always derived from the payment
   ledger rather than stored, so partial payments roll forward on their own.
   Data lives encrypted in this browser (AES-GCM, key derived from the
   sign-in password) and is backed up by exporting a file.
   ========================================================================= */

/* OAuth Client ID from Google Cloud Console. This is public by design — it
   ships in the page and identifies the app to Google. The client secret is
   deliberately NOT here: a static site cannot keep one, and the browser
   token flow does not use it. Access is bounded by the authorised
   JavaScript origins set on this client. */
const GOOGLE_CLIENT_ID = '108999565212-hm2sdqajqq3hos8mg5ids1aa36hgr35f.apps.googleusercontent.com';

const VAULT_KEY = 'loanbook_vault';
const AUTH_KEY  = 'loanbook_auth';
const TODAY = toISO(new Date());

/* ---------- utilities ---------- */
function toISO(dt){ const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
function addMonths(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return toISO(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last))); }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function fmtNaira(n){ const neg=n<0; n=Math.round(Math.abs(n||0)); let s=String(n),out=''; for(let i=0;i<s.length;i++){ if(i>0 && (s.length-i)%3===0) out+=','; out+=s[i]; } return (neg?'-':'')+'₦'+out; }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${String(d).padStart(2,'0')} ${M[m-1]} ${y}`; }
function fmtDateLong(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); const M=['January','February','March','April','May','June','July','August','September','October','November','December']; return `${d} ${M[m-1]} ${y}`; }
function fmtDateTime(ts){ const d=new Date(ts); return fmtDate(toISO(d))+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function relTime(iso){ const d=daysBetween(TODAY,iso); if(d===0) return 'today'; if(d===1) return 'tomorrow'; if(d>1) return 'in '+d+'d'; if(d===-1) return '1d ago'; return (-d)+'d ago'; }
function pct(a,b){ return b>0 ? Math.round(a/b*1000)/10 : 0; }

const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  borrowers:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  loans:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>',
  payments:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H3a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-3"/></svg>',
  letter:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>',
};
function icon(n){ return ICONS[n]||''; }

/* =========================== GOOGLE DRIVE SYNC ===========================
   Identity and storage both come from the user's own Google account: the
   book is kept as one readable loanbook.json in their Drive, so it survives
   a lost laptop, follows them to the phone, and can be opened by hand.
   Only files this app creates are visible to it (drive.file scope). */
const DRIVE_FILENAME = 'loanbook.json';
const DRIVE_SCOPES = 'openid email profile https://www.googleapis.com/auth/drive.file';
let gTokenClient = null, gAccessToken = null, gTokenExpiry = 0, driveFileId = null;
let syncState = 'idle', syncMessage = '', syncTimer = null;

function googleConfigured(){ return !!GOOGLE_CLIENT_ID; }
function googleReady(){ return !!(googleConfigured() && window.google && window.google.accounts && window.google.accounts.oauth2); }
function isSignedIn(){ return !!readAuth(); }
function waitForGoogle(ms){
  ms = ms||5000;
  return new Promise(resolve=>{
    if(!googleConfigured()) return resolve(false);
    const t0 = Date.now();
    (function check(){
      if(googleReady()) return resolve(true);
      if(Date.now()-t0 > ms) return resolve(false);
      setTimeout(check, 100);
    })();
  });
}
function requestToken(silent){
  return new Promise((resolve,reject)=>{
    if(!googleReady()) return reject(new Error('Google sign-in is not available on this page.'));
    if(!gTokenClient){
      gTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPES, callback: ()=>{}
      });
    }
    gTokenClient.callback = resp=>{
      if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
      gAccessToken = resp.access_token;
      gTokenExpiry = Date.now() + (Number(resp.expires_in||3600)-60)*1000;
      resolve(gAccessToken);
    };
    gTokenClient.error_callback = err=>reject(new Error((err&&err.message)||'Google sign-in was cancelled.'));
    /* An empty prompt reuses an existing grant silently and falls back to
       Google's own consent screen the first time. */
    try{ gTokenClient.requestAccessToken({prompt:''}); }
    catch(e){ reject(e); }
  });
}
async function ensureToken(){
  if(gAccessToken && Date.now() < gTokenExpiry) return gAccessToken;
  return requestToken(true);
}
async function gfetch(url, opts){
  opts = Object.assign({}, opts||{});
  let token = await ensureToken();
  opts.headers = Object.assign({}, opts.headers, {Authorization:'Bearer '+token});
  let res = await fetch(url, opts);
  if(res.status === 401){
    gAccessToken = null;
    token = await requestToken(true);
    opts.headers.Authorization = 'Bearer '+token;
    res = await fetch(url, opts);
  }
  if(!res.ok){ throw new Error('Drive '+res.status+': '+(await res.text()).slice(0,160)); }
  return res;
}
async function fetchGoogleProfile(){ return (await gfetch('https://www.googleapis.com/oauth2/v3/userinfo')).json(); }
async function findDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);
  const j = await res.json();
  return (j.files && j.files[0]) || null;
}
async function writeDriveFile(payload){
  const body = JSON.stringify(payload, null, 2);
  if(driveFileId){
    await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
      {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
    return driveFileId;
  }
  const boundary = 'lbk'+Math.random().toString(36).slice(2);
  const meta = JSON.stringify({name:DRIVE_FILENAME, mimeType:'application/json'});
  const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n`
    + `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const res = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body:multipart});
  driveFileId = (await res.json()).id;
  return driveFileId;
}
function setSync(s, msg){ syncState = s; syncMessage = msg||''; renderSyncBadge(); }
async function pushToDrive(){
  if(!isSignedIn() || !googleReady()) return;
  try{
    setSync('syncing');
    await writeDriveFile({app:'LoanBook', version:2, updatedAt:state.updatedAt||Date.now(), savedAt:new Date().toISOString(), data:state});
    state.lastBackup = Date.now();
    localStorage.setItem(VAULT_KEY, JSON.stringify({plain:state}));
    setSync('synced');
  }catch(e){ console.error(e); setSync('error', e.message); }
}
function schedulePush(){
  if(!isSignedIn() || !googleReady()) return;
  clearTimeout(syncTimer);
  setSync('syncing');
  syncTimer = setTimeout(pushToDrive, 1500);
}
/* On sign-in the newer of the two copies wins, so whichever device was used
   last is the one that carries. Single user, so last-write-wins is enough. */
async function syncOnSignIn(){
  setSync('syncing');
  try{
    const f = await findDriveFile();
    driveFileId = f ? f.id : null;
    const remote = f ? await (await gfetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json() : null;
    const localUpdated = (state && state.updatedAt) || 0;
    if(remote && remote.data && (remote.updatedAt||0) > localUpdated){
      const d = remote.data, base = freshState();
      for(const k in base){ if(d[k] === undefined) d[k] = base[k]; }
      state = d;
      localStorage.setItem(VAULT_KEY, JSON.stringify({plain:state}));
      setSync('synced');
      return 'pulled';
    }
    await pushToDrive();
    return f ? 'pushed' : 'created';
  }catch(e){ console.error(e); setSync('error', e.message); return 'error'; }
}
async function signInWithGoogle(){
  await requestToken(false);
  const profile = await fetchGoogleProfile();
  const prev = readAuth()||{};
  writeAuth({username: profile.name || profile.email, email: profile.email, createdAt: prev.createdAt||Date.now()});
  try{ await loadVault(); }catch(e){ state = freshState(); }
  if(!state) state = freshState();
  await syncOnSignIn();
}
function disconnectGoogle(){
  try{ if(gAccessToken && window.google) google.accounts.oauth2.revoke(gAccessToken, ()=>{}); }catch(e){}
  gAccessToken = null; driveFileId = null;
  localStorage.removeItem(AUTH_KEY);
  signOut();
}
function renderSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(!isSignedIn()){ el.style.display='none'; return; }
  el.style.display = 'flex';
  const map = {
    syncing:{t:'Saving…', c:'var(--ink-soft)'},
    synced:{t:'Saved to Drive', c:'var(--teal)'},
    error:{t:'Not saved', c:'var(--red)'},
    idle:{t:'', c:'var(--ink-faint)'}
  };
  const s = map[syncState]||map.idle;
  el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${s.c};flex:none;"></span><span>${s.t}</span>`;
  el.title = syncMessage || s.t;
}

function readAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
function writeAuth(a){ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }

/* Signing out drops the token and the local copy of the book. Nothing is
   lost — Drive holds it — and it leaves no records behind on a shared or
   borrowed computer. */
function signOut(){
  gAccessToken = null; driveFileId = null;
  try{ localStorage.removeItem(VAULT_KEY); }catch(e){}
  location.reload();
}

/* =========================== STATE =========================== */
let state = null;
let route = '#/dashboard';
let sortState = {}, filterState = {}, charts = {};

function freshState(){
  return {
    borrowers:[], loans:[], payments:[], notes:[], audit:[],
    seq:{loan:0, payment:0, note:0, audit:0},
    business:{name:'', address:'', phone:'', signatory:''},
    lastBackup:null,
    createdAt: Date.now()
  };
}
/* Drive is the record of truth; this is only a local copy so the book still
   opens instantly and survives a brief drop in connection. */
function persist(){
  try{ localStorage.setItem(VAULT_KEY, JSON.stringify({plain:state})); }
  catch(e){ console.error(e); }
}
function loadVault(){
  const raw = localStorage.getItem(VAULT_KEY);
  if(!raw){ state = freshState(); return; }
  const parsed = JSON.parse(raw);
  state = parsed.plain || freshState();
  const f = freshState();
  for(const k in f){ if(state[k] === undefined) state[k] = f[k]; }
}
function save(){
  if(state) state.updatedAt = Date.now();
  persist();
  schedulePush();
}
function nextId(kind,prefix){ state.seq[kind]=(state.seq[kind]||0)+1; return prefix+'-'+String(state.seq[kind]).padStart(4,'0'); }

/* Borrower IDs read from the name so repeat customers are recognisable
   at a glance (Ade profiles people by name, not by number). */
function makeBorrowerId(name){
  let base = initials(name).replace(/[^A-Z]/g,'') || 'BR';
  if(base.length < 2) base = (base+'X');
  let n = 1, id;
  do { id = base+'-'+String(n).padStart(3,'0'); n++; } while(state.borrowers.some(b=>b.id===id));
  return id;
}

/* =========================== LOAN ENGINE =========================== */
/* Rate is a MONTHLY percentage and may be 0. */
const STRUCTURES = {
  'interest-only': {
    label:'Interest monthly, capital at end',
    short:'Interest-only',
    desc:'Borrower pays interest each month and repays the capital with the final month\'s interest. This is the usual arrangement.'
  },
  'equal': {
    label:'Equal monthly instalments',
    short:'Equal instalments',
    desc:'Capital plus total interest divided evenly across every month of the tenor.'
  },
  'reducing': {
    label:'Reducing balance',
    short:'Reducing balance',
    desc:'Equal capital each month, with interest charged only on the balance still outstanding, so the monthly interest falls.'
  }
};
function buildPeriods(principal, monthlyRatePct, structure, months, firstPaymentDate){
  const r = (monthlyRatePct||0)/100;
  const periods = [];
  if(structure === 'equal'){
    const totalInterest = Math.round(principal * r * months);
    const total = principal + totalInterest;
    const base = Math.floor(total/months);
    const perInt = Math.round(totalInterest/months);
    let alloc = 0;
    for(let i=1;i<=months;i++){
      const scheduled = (i===months) ? (total-alloc) : base;
      alloc += scheduled;
      periods.push({period:i, interest:perInt, capital:scheduled-perInt, scheduled});
    }
  } else if(structure === 'reducing'){
    const capPer = Math.floor(principal/months);
    let rem = principal;
    for(let i=1;i<=months;i++){
      const interest = Math.round(rem*r);
      const capital = (i===months) ? rem : capPer;
      rem -= capital;
      periods.push({period:i, interest, capital, scheduled:interest+capital});
    }
  } else {
    for(let i=1;i<=months;i++){
      const interest = Math.round(principal*r);
      const capital = (i===months) ? principal : 0;
      periods.push({period:i, interest, capital, scheduled:interest+capital});
    }
  }
  periods.forEach((p,idx)=>{ p.dueDate = addMonths(firstPaymentDate, idx); });
  return periods;
}
function loanTerms(principal, rate, structure, months, firstPaymentDate){
  const periods = buildPeriods(principal, rate, structure, months, firstPaymentDate);
  return {
    periods,
    interestTotal: periods.reduce((s,p)=>s+p.interest,0),
    totalRepayable: periods.reduce((s,p)=>s+p.scheduled,0),
    finalDueDate: periods.length ? periods[periods.length-1].dueDate : firstPaymentDate
  };
}
function getLoanPayments(loanId){
  return state.payments.filter(p=>p.loanId===loanId).sort((a,b)=> a.date===b.date ? a.timestamp-b.timestamp : (a.date<b.date?-1:1));
}
/* Balances are derived from the payment ledger every time: money received is
   poured over the schedule oldest-first, so a shortfall rolls forward and an
   overpayment runs into later months without anyone editing the schedule. */
function computeLedger(loan){
  const pays = getLoanPayments(loan.id);
  const received = pays.reduce((s,p)=>s+p.amount,0);
  let remaining = received, overdueAmount = 0, nextDue = null;
  const schedule = loan.schedule.map(p=>{
    const allocated = Math.max(0, Math.min(remaining, p.scheduled));
    remaining -= allocated;
    const outstanding = p.scheduled - allocated;
    let status;
    if(p.scheduled === 0) status = 'No Payment';
    else if(outstanding <= 0) status = 'Paid';
    else if(p.dueDate < TODAY) status = 'Overdue';
    else if(allocated > 0) status = 'Partial';
    else if(p.dueDate === TODAY) status = 'Due Today';
    else status = 'Upcoming';
    if(outstanding > 0 && p.dueDate < TODAY) overdueAmount += outstanding;
    if(outstanding > 0 && !nextDue) nextDue = {date:p.dueDate, amount:outstanding, period:p.period};
    return Object.assign({}, p, {allocated, outstanding, status});
  });
  const totalOutstanding = Math.max(0, loan.totalRepayable - received);
  const oldestOverdue = schedule.find(p=>p.status==='Overdue');
  let status;
  if(totalOutstanding <= 0) status = 'Completed';
  else if(oldestOverdue) status = daysBetween(oldestOverdue.dueDate, TODAY) > 90 ? 'Defaulted' : 'Overdue';
  else status = 'Active';
  return {
    schedule, totalPaid:received, totalOutstanding, overdueAmount, nextDue, status,
    advanceCredit: Math.max(0, received - loan.totalRepayable),
    pctPaid: Math.min(100, pct(received, loan.totalRepayable)),
    paymentsCount: pays.length
  };
}
function withLedger(loan){ return Object.assign({}, loan, {ledger:computeLedger(loan)}); }
function allLoans(){ return state.loans.map(withLedger); }
function getBorrower(id){ return state.borrowers.find(b=>b.id===id); }
function getLoan(id){ return state.loans.find(l=>l.id===id); }
function borrowerLoans(bid){ return allLoans().filter(l=>l.borrowerId===bid); }
function borrowerName(id){ const b=getBorrower(id); return b?b.name:'—'; }

/* =========================== MUTATIONS =========================== */
function logAudit(action, entity, entityId, detail){
  state.audit.unshift({id:nextId('audit','AUD'), action, entity, entityId, detail, user:(readAuth()||{}).username||'user', timestamp:Date.now()});
  if(state.audit.length > 500) state.audit.length = 500;
}
function addBorrower(data, opts){
  opts = opts||{};
  const b = {
    id: makeBorrowerId(data.name), name:data.name.trim(), phone:data.phone||'', email:data.email||'',
    address:data.address||'', idType:data.idType||'', idNumber:data.idNumber||'',
    guarantor:data.guarantor||'', employment:data.employment||'', bankInfo:data.bankInfo||'',
    dateAdded:data.dateAdded||TODAY
  };
  state.borrowers.push(b);
  logAudit('Borrower added','Borrower',b.id,`${b.name} added to the register`);
  if(!opts.silent) save();
  return b;
}
function addLoan(data, opts){
  opts = opts||{};
  const t = loanTerms(data.principal, data.rate, data.structure, data.months, data.firstPaymentDate);
  const loan = {
    id: nextId('loan','LN'), borrowerId:data.borrowerId, principal:data.principal,
    rate:data.rate, structure:data.structure, months:data.months,
    startDate:data.startDate, firstPaymentDate:data.firstPaymentDate,
    interestTotal:t.interestTotal, totalRepayable:t.totalRepayable, finalDueDate:t.finalDueDate,
    purpose:data.purpose||'', createdDate:data.createdDate||TODAY, schedule:t.periods
  };
  state.loans.push(loan);
  logAudit('Loan created','Loan',loan.id,`${fmtNaira(loan.principal)} to ${borrowerName(loan.borrowerId)} · ${loan.rate}%/month ${STRUCTURES[loan.structure].short} · ${loan.months} month(s)`);
  if(!opts.silent) save();
  return loan;
}
function addPayment(data, opts){
  opts = opts||{};
  const p = {
    id: nextId('payment','PMT'), loanId:data.loanId, borrowerId:data.borrowerId, date:data.date,
    amount:data.amount, method:data.method, reference:data.reference||'', notes:data.notes||'',
    timestamp: data.timestamp || Date.now()
  };
  state.payments.push(p);
  logAudit('Payment recorded','Payment',p.id,`${fmtNaira(p.amount)} on ${p.loanId} from ${borrowerName(p.borrowerId)} via ${p.method}`);
  if(!opts.silent) save();
  return p;
}
function addNote(data, opts){
  opts = opts||{};
  const n = {id:nextId('note','NOTE'), borrowerId:data.borrowerId||null, loanId:data.loanId||null, text:data.text, createdAt:data.createdAt||Date.now()};
  state.notes.unshift(n);
  logAudit('Note added', data.loanId?'Loan':'Borrower', data.loanId||data.borrowerId, n.text.slice(0,70));
  if(!opts.silent) save();
  return n;
}

/* =========================== METRICS =========================== */
function metrics(){
  const loans = allLoans();
  const open = loans.filter(l=>l.ledger.status!=='Completed');
  const overdue = loans.filter(l=>l.ledger.overdueAmount>0);
  const weekEnd = addDaysISO(TODAY,7), monthEnd = addDaysISO(TODAY,30);
  const dueIn = (from,to)=>loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date>=from && l.ledger.nextDue.date<=to);
  return {
    borrowers: state.borrowers.length,
    openLoans: open.length,
    disbursed: state.loans.reduce((s,l)=>s+l.principal,0),
    expected: state.loans.reduce((s,l)=>s+l.totalRepayable,0),
    collected: state.payments.reduce((s,p)=>s+p.amount,0),
    outstanding: loans.reduce((s,l)=>s+l.ledger.totalOutstanding,0),
    overdueAmount: loans.reduce((s,l)=>s+l.ledger.overdueAmount,0),
    overdueCount: overdue.length,
    completed: loans.filter(l=>l.ledger.status==='Completed').length,
    interestEarned: state.payments.reduce((s,p)=>s+p.amount,0) - state.loans.reduce((s,l)=>{
      const led = computeLedger(l); return s + Math.min(led.totalPaid, l.principal);
    },0),
    dueToday: loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date===TODAY).length,
    dueWeek: dueIn(TODAY, weekEnd).length,
    dueMonth: dueIn(TODAY, monthEnd).length,
    overdueList: overdue.sort((a,b)=>b.ledger.overdueAmount-a.ledger.overdueAmount),
    upcoming: loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date>=TODAY)
                   .sort((a,b)=>a.ledger.nextDue.date<b.ledger.nextDue.date?-1:1).slice(0,7)
  };
}
function buildAlerts(){
  const items = [];
  allLoans().forEach(l=>{
    const nm = borrowerName(l.borrowerId), led = l.ledger;
    if(led.overdueAmount>0){
      const d = led.nextDue ? daysBetween(led.nextDue.date, TODAY) : 0;
      items.push({type:'overdue', color:'var(--red)', sort:3, time:led.nextDue?led.nextDue.date:TODAY,
        text:`<b>${esc(nm)}</b> is overdue by ${fmtNaira(led.overdueAmount)} on ${l.id}${d>0?` (${d} day${d===1?'':'s'})`:''}.`});
    } else if(led.nextDue && led.nextDue.date===TODAY){
      items.push({type:'due', color:'var(--gold)', sort:2, time:TODAY, text:`<b>${esc(nm)}</b> owes ${fmtNaira(led.nextDue.amount)} today on ${l.id}.`});
    } else if(led.nextDue && daysBetween(TODAY, led.nextDue.date)<=7 && daysBetween(TODAY, led.nextDue.date)>0){
      items.push({type:'upcoming', color:'var(--teal)', sort:1, time:led.nextDue.date,
        text:`<b>${esc(nm)}</b> owes ${fmtNaira(led.nextDue.amount)} ${relTime(led.nextDue.date)} on ${l.id}.`});
    }
  });
  items.sort((a,b)=> b.sort-a.sort || (a.time<b.time?-1:1));
  return items;
}

/* =========================== ROUTER =========================== */
const NAV = [
  {route:'#/dashboard', label:'Dashboard', icon:'dashboard'},
  {route:'#/borrowers', label:'Borrowers', icon:'borrowers'},
  {route:'#/loans', label:'Loans', icon:'loans'},
  {route:'#/payments', label:'Payments', icon:'payments'},
  {route:'#/reports', label:'Reports', icon:'reports'},
  {route:'#/settings', label:'Settings', icon:'settings'},
];
function renderNav(){
  const overdue = allLoans().filter(l=>l.ledger.overdueAmount>0).length;
  document.getElementById('mainnav').innerHTML = NAV.map(n=>{
    const active = route===n.route || route.startsWith(n.route+'/');
    const badge = n.route==='#/loans' && overdue>0 ? `<span class="badge-count">${overdue}</span>` : '';
    return `<button class="navlink ${active?'active':''}" onclick="navigate('${n.route}')">${icon(n.icon)}<span>${n.label}</span>${badge}</button>`;
  }).join('');
}
function navigate(r){ route=r; location.hash=r; closePanels(); closeSidebar(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', ()=>{ if(!state) return; route = location.hash||'#/dashboard'; render(); });

function render(){
  renderNav();
  const app = document.getElementById('app');
  const parts = route.replace('#/','').split('/');
  const page = parts[0]||'dashboard';
  try{
    if(page==='dashboard') app.innerHTML = pageDashboard();
    else if(page==='borrowers' && parts[1]) app.innerHTML = pageBorrower(parts[1]);
    else if(page==='borrowers') app.innerHTML = pageBorrowers();
    else if(page==='loans' && parts[1]) app.innerHTML = pageLoan(parts[1]);
    else if(page==='loans') app.innerHTML = pageLoans();
    else if(page==='payments') app.innerHTML = pagePayments();
    else if(page==='reports') app.innerHTML = pageReports();
    else if(page==='settings') app.innerHTML = pageSettings();
    else app.innerHTML = pageDashboard();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="section"><h3>Something went wrong</h3><p class="mono" style="color:var(--red);white-space:pre-wrap;">${esc(err.message)}</p></div>`;
  }
  if(page==='dashboard' && state.loans.length) drawCharts();
  updateNotifDot();
}
function rerender(page){
  const map = {borrowers:pageBorrowers, loans:pageLoans, payments:pagePayments, reports:pageReports, settings:pageSettings};
  document.getElementById('app').innerHTML = map[page]();
}

  <div class="page-head"><div><h1>Welcome to LoanBook</h1><p class="page-sub">Your book is empty. Add your first borrower, or load a sample book to look around first.</p></div></div>
  <div class="section">
    <div class="empty-state">
      ${icon('empty')}
      <p>Nothing recorded yet.</p>
      <div class="empty-actions">
        <button class="btn btn-primary" onclick="openBorrowerModal()">${icon('plus')} Add a borrower</button>
        <button class="btn" onclick="confirmSample()">Load sample book</button>
      </div>
    </div>
  </div>`;
}
function confirmSample(){ loadSampleData(); toast('Sample book loaded'); navigate('#/dashboard'); }

function drawCharts(){
  if(typeof Chart === 'undefined') return;
  const css = getComputedStyle(document.documentElement), tok = n=>css.getPropertyValue(n).trim();
  ['chartCollections','chartStatus'].forEach(id=>{ if(charts[id]){ charts[id].destroy(); delete charts[id]; } });
  const months = []; for(let i=5;i>=0;i--) months.push(addMonths(TODAY,-i).slice(0,7));
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const labels = months.map(ym=>{ const [y,mo]=ym.split('-'); return M[+mo-1]+' '+y.slice(2); });
  const expected = months.map(ym=>{ let s=0; state.loans.forEach(l=>l.schedule.forEach(p=>{ if(p.dueDate.slice(0,7)===ym) s+=p.scheduled; })); return s; });
  const collected = months.map(ym=>{ let s=0; state.payments.forEach(p=>{ if(p.date.slice(0,7)===ym) s+=p.amount; }); return s; });
  const c1 = document.getElementById('chartCollections');
  if(c1) charts.chartCollections = new Chart(c1, {type:'bar', data:{labels, datasets:[
      {label:'Expected', data:expected, backgroundColor:tok('--surface-3'), borderRadius:4, maxBarThickness:24},
      {label:'Collected', data:collected, backgroundColor:tok('--accent'), borderRadius:4, maxBarThickness:24}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{color:tok('--ink-soft'), boxWidth:10, font:{family:'IBM Plex Sans', size:11}}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtNaira(c.parsed.y)}}},
      scales:{x:{ticks:{color:tok('--ink-faint'), font:{size:11}}, grid:{display:false}},
        y:{ticks:{color:tok('--ink-faint'), font:{size:10}, callback:v=>'₦'+(v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000)+'k':v)}, grid:{color:tok('--border')}}}}});
  const order = ['Active','Overdue','Defaulted','Completed'];
  const loans = allLoans();
  const counts = order.map(s=>loans.filter(l=>l.ledger.status===s).length);
  const c2 = document.getElementById('chartStatus');
  if(c2) charts.chartStatus = new Chart(c2, {type:'doughnut',
    data:{labels:order, datasets:[{data:counts, backgroundColor:[tok('--accent'),tok('--gold'),tok('--red'),tok('--teal')], borderWidth:0, hoverOffset:4}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'66%',
      plugins:{legend:{position:'bottom', labels:{color:tok('--ink-soft'), boxWidth:10, padding:12, font:{family:'IBM Plex Sans', size:11}}}}}});
}

/* =========================== BORROWERS =========================== */
function pageBorrowers(){
  const q = (filterState.bq||'').toLowerCase();
  let rows = state.borrowers.map(b=>{
    const loans = borrowerLoans(b.id);
    return {b, loans,
      open: loans.filter(l=>l.ledger.status!=='Completed').length,
      outstanding: loans.reduce((s,l)=>s+l.ledger.totalOutstanding,0),
      overdue: loans.reduce((s,l)=>s+l.ledger.overdueAmount,0)};
  });
  if(q) rows = rows.filter(r=> r.b.name.toLowerCase().includes(q) || (r.b.phone||'').includes(q) || r.b.id.toLowerCase().includes(q));
  rows.sort((a,b)=> b.overdue-a.overdue || a.b.name.localeCompare(b.b.name));
  return `
  <div class="page-head">
    <div><h1>Borrowers</h1><p class="page-sub">Each person keeps one ID for life. Repeat loans sit under the same record.</p></div>
    <div class="head-actions"><button class="btn btn-primary" onclick="openBorrowerModal()">${icon('plus')} Add borrower</button></div>
  </div>
  <div class="section">
    <div class="table-toolbar">
      <input class="input" style="flex:1;min-width:210px;" placeholder="Search name, phone or ID..." value="${esc(filterState.bq||'')}" oninput="filterState.bq=this.value; rerender('borrowers')">
      <span class="shint">${rows.length} borrower${rows.length===1?'':'s'}</span>
    </div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Borrower</th><th>Phone</th><th class="num">Loans</th><th class="num">Still owed</th><th class="num">Overdue</th><th>Added</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="rowlink" onclick="navigate('#/borrowers/${r.b.id}')">
        <td><div class="cell-primary">${esc(r.b.name)}</div><div class="cell-sub mono">${r.b.id}</div></td>
        <td>${esc(r.b.phone||'—')}</td>
        <td class="num mono">${r.loans.length}${r.open?` <span class="cell-sub">(${r.open} open)</span>`:''}</td>
        <td class="num mono">${fmtNaira(r.outstanding)}</td>
        <td class="num mono" style="${r.overdue>0?'color:var(--red);':''}">${r.overdue>0?fmtNaira(r.overdue):'—'}</td>
        <td>${fmtDate(r.b.dateAdded)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state">${icon('empty')}<p>No borrowers yet.</p><div class="empty-actions"><button class="btn btn-primary" onclick="openBorrowerModal()">${icon('plus')} Add borrower</button></div></div>`}
  </div>`;
}
function pageBorrower(id){
  const b = getBorrower(id);
  if(!b) return `<div class="empty-state">${icon('empty')}<p>Borrower not found.</p><div class="empty-actions"><button class="btn" onclick="navigate('#/borrowers')">Back to borrowers</button></div></div>`;
  const loans = borrowerLoans(id);
  const open = loans.filter(l=>l.ledger.status!=='Completed');
  const borrowed = loans.reduce((s,l)=>s+l.principal,0);
  const repaid = loans.reduce((s,l)=>s+l.ledger.totalPaid,0);
  const outstanding = loans.reduce((s,l)=>s+l.ledger.totalOutstanding,0);
  const overdue = loans.reduce((s,l)=>s+l.ledger.overdueAmount,0);
  const nextDue = loans.map(l=>l.ledger.nextDue).filter(Boolean).sort((a,c)=>a.date<c.date?-1:1)[0];
  const payments = state.payments.filter(p=>p.borrowerId===id).sort((a,c)=>c.timestamp-a.timestamp);
  const notes = state.notes.filter(n=>n.borrowerId===id && !n.loanId);
  return `
  <button class="btn btn-ghost btn-sm no-print" onclick="navigate('#/borrowers')" style="margin-bottom:14px;">${icon('arrow')} Borrowers</button>
  <div class="detail-header">
    <div class="avatar-lg">${initials(b.name)}</div>
    <div style="flex:1;min-width:230px;">
      <div class="detail-title-row"><h1>${esc(b.name)}</h1>${overdue>0?statusBadge('Overdue'):(open.length?statusBadge('Active'):statusBadge('Completed'))}</div>
      <div class="detail-meta-row">
        <span class="mono">${b.id}</span>
        <span>${esc(b.phone||'no phone')}</span>
        ${b.email?`<span>${esc(b.email)}</span>`:''}
        <span>${loans.length} loan${loans.length===1?'':'s'} to date</span>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn" onclick="openNoteModal({borrowerId:'${b.id}'})">${icon('note')} Add note</button>
      <button class="btn btn-primary" onclick="openLoanModal('${b.id}')">${icon('plus')} New loan for ${esc(b.name.split(' ')[0])}</button>
    </div>
  </div>
  <div class="stat-strip">
    <div class="st"><div class="st-label">Borrowed to date</div><div class="st-value">${fmtNaira(borrowed)}</div></div>
    <div class="st"><div class="st-label">Repaid</div><div class="st-value">${fmtNaira(repaid)}</div></div>
    <div class="st"><div class="st-label">Still owed</div><div class="st-value">${fmtNaira(outstanding)}</div></div>
    <div class="st"><div class="st-label">Overdue</div><div class="st-value" style="${overdue>0?'color:var(--red);':''}">${fmtNaira(overdue)}</div></div>
    <div class="st"><div class="st-label">Next payment</div><div class="st-value">${nextDue?fmtDate(nextDue.date):'—'}</div></div>
  </div>
  <div class="grid-2">
    <div>
      <div class="section">
        <div class="section-head"><h3>Loans</h3><span class="shint">${open.length} open · ${loans.length-open.length} settled</span></div>
        ${loans.length ? `<div class="table-wrap"><table><thead><tr><th>Loan</th><th class="num">Capital</th><th>Terms</th><th class="num">Still owed</th><th>Status</th></tr></thead><tbody>
          ${loans.map(l=>`<tr class="rowlink" onclick="navigate('#/loans/${l.id}')"><td class="mono cell-primary">${l.id}</td><td class="num mono">${fmtNaira(l.principal)}</td><td class="cell-sub">${l.rate}%/mo · ${l.months}mo · ${STRUCTURES[l.structure].short}</td><td class="num mono">${fmtNaira(l.ledger.totalOutstanding)}</td><td>${statusBadge(l.ledger.status)}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state">${icon('empty')}<p>No loans yet for ${esc(b.name)}.</p></div>`}
      </div>
      <div class="section">
        <div class="section-head"><h3>Payment history</h3><span class="shint">${payments.length} payment${payments.length===1?'':'s'}</span></div>
        ${payments.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Loan</th><th class="num">Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody>
          ${payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td class="mono">${p.loanId}</td><td class="num mono">${fmtNaira(p.amount)}</td><td>${esc(p.method)}</td><td class="mono cell-sub">${esc(p.reference||'—')}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state">${icon('empty')}<p>Nothing received yet.</p></div>`}
      </div>
    </div>
    <div>
      <div class="section">
        <div class="section-head"><h3>Details</h3></div>
        ${infoRow('Phone', b.phone)}${infoRow('Email', b.email)}${infoRow('Address', b.address)}
        ${infoRow('ID type', b.idType)}${infoRow('ID number', b.idNumber, true)}
        ${infoRow('Guarantor', b.guarantor)}${infoRow('Work / business', b.employment)}${infoRow('Bank', b.bankInfo)}
        ${infoRow('On the book since', fmtDate(b.dateAdded))}
      </div>
      <div class="section">
        <div class="section-head"><h3>Notes</h3><button class="btn btn-sm no-print" onclick="openNoteModal({borrowerId:'${b.id}'})">Add</button></div>

function infoRow(label,val,mono){ return `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;"><span style="color:var(--ink-soft);">${label}</span><span style="text-align:right;${mono?'font-family:var(--font-mono);':''}">${esc(val||'—')}</span></div>`; }
function noteHtml(n){ return `<div class="note-item"><div class="note-text">${esc(n.text)}</div><div class="note-meta">${fmtDateTime(n.createdAt)}</div></div>`; }

/* =========================== LOANS =========================== */
function pageLoans(){
  filterState.ls = filterState.ls || 'All';
  const q = (filterState.lq||'').toLowerCase();
  let loans = allLoans();
  if(filterState.ls!=='All') loans = loans.filter(l=>l.ledger.status===filterState.ls);
  if(q) loans = loans.filter(l=> l.id.toLowerCase().includes(q) || borrowerName(l.borrowerId).toLowerCase().includes(q));
  loans.sort((a,b)=>{
    const rank = s=>({Overdue:0,Defaulted:1,Active:2,Completed:3})[s];
    return rank(a.ledger.status)-rank(b.ledger.status) || (a.ledger.nextDue?.date||'9999').localeCompare(b.ledger.nextDue?.date||'9999');
  });
  const statuses = ['All','Active','Overdue','Defaulted','Completed'];
  return `
  <div class="page-head">
    <div><h1>Loans</h1><p class="page-sub">Every loan with live balances and the next date money is due.</p></div>
    <div class="head-actions">
      <button class="btn" onclick="exportLoansCSV()">${icon('download')} Export</button>
      <button class="btn btn-primary" onclick="openLoanModal()">${icon('plus')} New loan</button>
    </div>
  </div>
  <div class="section">
    <div class="table-toolbar">
      <input class="input" style="flex:1;min-width:200px;" placeholder="Search loan or borrower..." value="${esc(filterState.lq||'')}" oninput="filterState.lq=this.value; rerender('loans')">
      <div class="pill-group">${statuses.map(s=>`<button class="filter-pill ${filterState.ls===s?'active':''}" onclick="filterState.ls='${s}'; rerender('loans')">${s}</button>`).join('')}</div>
    </div>
    ${loans.length ? `<div class="table-wrap"><table><thead><tr>
      <th>Loan</th><th>Borrower</th><th class="num">Capital</th><th>Rate</th><th>Structure</th>
      <th class="num">Repayable</th><th class="num">Paid</th><th class="num">Still owed</th><th>Next due</th><th>Status</th>
    </tr></thead><tbody>
      ${loans.map(l=>`<tr class="rowlink" onclick="navigate('#/loans/${l.id}')">
        <td class="mono cell-primary">${l.id}</td>
        <td>${esc(borrowerName(l.borrowerId))}</td>
        <td class="num mono">${fmtNaira(l.principal)}</td>
        <td class="mono">${l.rate}%/mo</td>
        <td class="cell-sub">${STRUCTURES[l.structure].short}</td>
        <td class="num mono">${fmtNaira(l.totalRepayable)}</td>
        <td class="num mono">${fmtNaira(l.ledger.totalPaid)}</td>
        <td class="num mono" style="${l.ledger.overdueAmount>0?'color:var(--red);':''}">${fmtNaira(l.ledger.totalOutstanding)}</td>
        <td>${l.ledger.nextDue?fmtDate(l.ledger.nextDue.date):'—'}</td>
        <td>${statusBadge(l.ledger.status)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state">${icon('empty')}<p>No loans match.</p></div>`}
  </div>`;
}
function pageLoan(id){
  const loan = getLoan(id);
  if(!loan) return `<div class="empty-state">${icon('empty')}<p>Loan not found.</p><div class="empty-actions"><button class="btn" onclick="navigate('#/loans')">Back to loans</button></div></div>`;
  const led = computeLedger(loan);
  const b = getBorrower(loan.borrowerId);
  const pays = getLoanPayments(id).slice().reverse();
  const notes = state.notes.filter(n=>n.loanId===id);
  const auditItems = state.audit.filter(a=>a.entityId===id || pays.some(p=>p.id===a.entityId));
  return `
  <button class="btn btn-ghost btn-sm no-print" onclick="navigate('#/loans')" style="margin-bottom:14px;">${icon('arrow')} Loans</button>
  <div class="detail-header">
    <div style="flex:1;min-width:230px;">
      <div class="detail-title-row"><h1>${loan.id}</h1>${statusBadge(led.status)}</div>
      <div class="detail-meta-row">
        <span><a href="javascript:void(0)" onclick="navigate('#/borrowers/${loan.borrowerId}')">${esc(b?b.name:'—')}</a> · ${b?b.id:''}</span>
        <span>${loan.rate}% per month</span>
        <span>${STRUCTURES[loan.structure].short}</span>
        <span>${loan.months} month${loan.months===1?'':'s'}</span>
        <span>Given ${fmtDate(loan.startDate)}</span>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn" onclick="openLetter('${loan.id}')">${icon('letter')} Confirmation letter</button>
      <button class="btn" onclick="openNoteModal({loanId:'${loan.id}'})">${icon('note')} Note</button>
      <button class="btn btn-primary" onclick="openRecordPaymentModal('${loan.borrowerId}','${loan.id}')">${icon('plus')} Record payment</button>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Repayment progress</h3><span class="shint">${fmtNaira(led.totalPaid)} of ${fmtNaira(loan.totalRepayable)}</span></div>
    <div class="progress-track"><div class="progress-fill ${led.status==='Completed'?'teal':(led.overdueAmount>0?'red':'')}" style="width:${led.pctPaid}%;"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;gap:8px;">
      <span>${led.pctPaid}% repaid</span>
      <span>${loan.purpose?'Purpose: '+esc(loan.purpose):''}</span>
    </div>
  </div>

  <div class="stat-strip">
    <div class="st"><div class="st-label">Capital given</div><div class="st-value">${fmtNaira(loan.principal)}</div></div>
    <div class="st"><div class="st-label">Interest (${loan.rate}%/mo)</div><div class="st-value">${fmtNaira(loan.interestTotal)}</div></div>
    <div class="st"><div class="st-label">Total repayable</div><div class="st-value">${fmtNaira(loan.totalRepayable)}</div></div>
    <div class="st"><div class="st-label">Still owed</div><div class="st-value" style="${led.totalOutstanding>0?'color:var(--gold);':''}">${fmtNaira(led.totalOutstanding)}</div></div>
    <div class="st"><div class="st-label">${led.advanceCredit>0?'Paid in advance':'Overdue'}</div><div class="st-value" style="${led.overdueAmount>0?'color:var(--red);':''}">${fmtNaira(led.advanceCredit>0?led.advanceCredit:led.overdueAmount)}</div></div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Repayment schedule</h3><span class="shint">Final payment ${fmtDate(loan.finalDueDate)} · shortfalls roll forward automatically</span></div>
    <div class="table-wrap"><table><thead><tr><th>Month</th><th>Due date</th><th class="num">Interest</th><th class="num">Capital</th><th class="num">Due</th><th class="num">Paid</th><th class="num">Outstanding</th><th>Status</th></tr></thead><tbody>
      ${led.schedule.map(p=>`<tr>
        <td>${p.period}</td><td>${fmtDate(p.dueDate)}</td>
        <td class="num mono">${fmtNaira(p.interest)}</td>
        <td class="num mono">${p.capital?fmtNaira(p.capital):'—'}</td>
        <td class="num mono cell-primary">${fmtNaira(p.scheduled)}</td>
        <td class="num mono">${fmtNaira(p.allocated)}</td>
        <td class="num mono" style="${p.outstanding>0 && p.dueDate<=TODAY?'color:var(--red);':''}">${fmtNaira(p.outstanding)}</td>
        <td>${statusBadge(p.status)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>

  <div class="grid-2">
    <div class="section">
      <div class="section-head"><h3>Payments received</h3><span class="shint">${pays.length}</span></div>
      ${pays.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th class="num">Amount</th><th>Method</th><th>Reference</th><th>Note</th></tr></thead><tbody>
        ${pays.map(p=>`<tr><td>${fmtDate(p.date)}</td><td class="num mono">${fmtNaira(p.amount)}</td><td>${esc(p.method)}</td><td class="mono cell-sub">${esc(p.reference||'—')}</td><td class="cell-sub">${esc(p.notes||'—')}</td></tr>`).join('')}

    </div>
    <div>
      <div class="section">
        <div class="section-head"><h3>Notes</h3></div>
        ${notes.length ? `<div class="notes-list">${notes.map(noteHtml).join('')}</div>` : `<p class="shint">No notes on this loan.</p>`}
      </div>
      <div class="section">
        <div class="section-head"><h3>History</h3></div>
        ${auditItems.length ? auditItems.slice(0,12).map(a=>`<div class="audit-item"><span class="audit-dot"></span><div><div>${esc(a.detail)}</div><div class="audit-time">${fmtDateTime(a.timestamp)}</div></div></div>`).join('') : `<p class="shint">No history.</p>`}
      </div>
    </div>
  </div>`;
}

/* =========================== PAYMENTS =========================== */
function pagePayments(){
  filterState.pm = filterState.pm||'All';
  filterState.pb = filterState.pb||'All';
  const q = (filterState.pq||'').toLowerCase();
  let pays = [...state.payments].sort((a,b)=>b.timestamp-a.timestamp);
  if(filterState.pm!=='All') pays = pays.filter(p=>p.method===filterState.pm);
  if(filterState.pb!=='All') pays = pays.filter(p=>p.borrowerId===filterState.pb);
  if(q) pays = pays.filter(p=> (p.reference||'').toLowerCase().includes(q) || p.loanId.toLowerCase().includes(q) || borrowerName(p.borrowerId).toLowerCase().includes(q));
  const methods = ['All','Bank Transfer','Cash','POS','Direct Debit','Other'];
  const total = pays.reduce((s,p)=>s+p.amount,0);
  return `
  <div class="page-head">
    <div><h1>Payments</h1><p class="page-sub">Every payment received, in the order it came in. Balances everywhere else are worked out from this list.</p></div>
    <div class="head-actions">
      <button class="btn" onclick="exportPaymentsCSV()">${icon('download')} Export</button>
      <button class="btn btn-primary" onclick="openRecordPaymentModal()">${icon('plus')} Record payment</button>
    </div>
  </div>
  <div class="section">
    <div class="table-toolbar">
      <input class="input" style="flex:1;min-width:190px;" placeholder="Search reference, loan or borrower..." value="${esc(filterState.pq||'')}" oninput="filterState.pq=this.value; rerender('payments')">
      <select class="select" onchange="filterState.pb=this.value; rerender('payments')">
        <option value="All">All borrowers</option>
        ${state.borrowers.map(b=>`<option value="${b.id}" ${filterState.pb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
      </select>
      <div class="pill-group">${methods.map(m=>`<button class="filter-pill ${filterState.pm===m?'active':''}" onclick="filterState.pm='${m}'; rerender('payments')">${m}</button>`).join('')}</div>
      <span class="shint" style="margin-left:auto;">${pays.length} payment${pays.length===1?'':'s'} · <b class="mono">${fmtNaira(total)}</b></span>
    </div>
    ${pays.length ? `<div class="table-wrap"><table><thead><tr><th>Ref no.</th><th>Date</th><th>Borrower</th><th>Loan</th><th class="num">Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody>
      ${pays.map(p=>`<tr class="rowlink" onclick="navigate('#/loans/${p.loanId}')"><td class="mono cell-primary">${p.id}</td><td>${fmtDate(p.date)}</td><td>${esc(borrowerName(p.borrowerId))}</td><td class="mono">${p.loanId}</td><td class="num mono">${fmtNaira(p.amount)}</td><td>${esc(p.method)}</td><td class="mono cell-sub">${esc(p.reference||'—')}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state">${icon('empty')}<p>No payments match.</p></div>`}
  </div>`;
}

    {k:'portfolio', t:'Loan book', d:'Every loan and what is left on it'},
    {k:'collection', t:'Collections', d:'Payments received'},
    {k:'overdue', t:'Overdue', d:'Who is behind, and by how long'},
    {k:'statement', t:'Borrower statement', d:'Full history for one person'},
    {k:'monthly', t:'Monthly performance', d:'Expected against actual'},
    {k:'audit', t:'Activity log', d:'Every change made'},
  ];
  return `
  <div class="page-head"><div><h1>Reports</h1><p class="page-sub">Worked out live from the ledger. Print any of these or save as PDF.</p></div></div>
  <div class="report-grid">
    ${tabs.map(t=>`<button class="report-tile ${filterState.rt===t.k?'active':''}" onclick="filterState.rt='${t.k}'; rerender('reports')"><h4>${t.t}</h4><p>${t.d}</p></button>`).join('')}
  </div>
  ${reportBody(filterState.rt)}`;
}
function reportShell(title, sub, body){
  return `<div class="section">
    <div class="section-head"><div><h3>${title}</h3><span class="shint">${sub||''}</span></div>
    <div class="head-actions no-print"><button class="btn btn-sm" onclick="window.__exp&&window.__exp()">${icon('download')} CSV</button><button class="btn btn-sm" onclick="window.print()">${icon('print')} Print</button></div></div>
    ${body}</div>`;
}
function reportBody(tab){
  const loans = allLoans();
  if(tab==='portfolio'){
    window.__exp = exportLoansCSV;
    return reportShell('Loan book', `${loans.length} loans as at ${fmtDate(TODAY)}`,
      `<div class="table-wrap"><table><thead><tr><th>Loan</th><th>Borrower</th><th class="num">Capital</th><th>Rate</th><th class="num">Repayable</th><th class="num">Paid</th><th class="num">Owed</th><th>Status</th></tr></thead><tbody>
      ${loans.map(l=>`<tr><td class="mono">${l.id}</td><td>${esc(borrowerName(l.borrowerId))}</td><td class="num mono">${fmtNaira(l.principal)}</td><td class="mono">${l.rate}%</td><td class="num mono">${fmtNaira(l.totalRepayable)}</td><td class="num mono">${fmtNaira(l.ledger.totalPaid)}</td><td class="num mono">${fmtNaira(l.ledger.totalOutstanding)}</td><td>${statusBadge(l.ledger.status)}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  if(tab==='collection'){
    window.__exp = exportPaymentsCSV;
    const pays = [...state.payments].sort((a,b)=>b.timestamp-a.timestamp);
    return reportShell('Collections', `${fmtNaira(pays.reduce((s,p)=>s+p.amount,0))} received in total`,
      `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Borrower</th><th>Loan</th><th class="num">Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody>
      ${pays.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(borrowerName(p.borrowerId))}</td><td class="mono">${p.loanId}</td><td class="num mono">${fmtNaira(p.amount)}</td><td>${esc(p.method)}</td><td class="mono cell-sub">${esc(p.reference||'—')}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  if(tab==='overdue'){
    const od = loans.filter(l=>l.ledger.overdueAmount>0).sort((a,b)=>b.ledger.overdueAmount-a.ledger.overdueAmount);
    window.__exp = ()=>downloadCSV('overdue.csv',[['Loan','Borrower','Phone','Overdue','Days late','Status'],
      ...od.map(l=>{const b=getBorrower(l.borrowerId); return [l.id,b?b.name:'',b?b.phone:'',l.ledger.overdueAmount,l.ledger.nextDue?daysBetween(l.ledger.nextDue.date,TODAY):0,l.ledger.status];})]);
    return reportShell('Overdue', `${od.length} loan(s) · ${fmtNaira(od.reduce((s,l)=>s+l.ledger.overdueAmount,0))} outstanding past due`,
      od.length?`<div class="table-wrap"><table><thead><tr><th>Borrower</th><th>Phone</th><th>Loan</th><th class="num">Overdue</th><th class="num">Days late</th><th>Status</th></tr></thead><tbody>
      ${od.map(l=>{const b=getBorrower(l.borrowerId); const d=l.ledger.nextDue?daysBetween(l.ledger.nextDue.date,TODAY):0;
        return `<tr><td class="cell-primary">${esc(b?b.name:'')}</td><td>${esc(b?b.phone:'')}</td><td class="mono">${l.id}</td><td class="num mono" style="color:var(--red);">${fmtNaira(l.ledger.overdueAmount)}</td><td class="num mono">${d}</td><td>${statusBadge(l.ledger.status)}</td></tr>`;}).join('')}
      </tbody></table></div>`:`<div class="empty-state">${icon('empty')}<p>Nothing overdue.</p></div>`);
  }
  if(tab==='statement'){
    filterState.sb = filterState.sb || (state.borrowers[0]&&state.borrowers[0].id);
    const b = getBorrower(filterState.sb);
    const picker = `<div class="no-print" style="margin-bottom:14px;"><select class="select" onchange="filterState.sb=this.value; rerender('reports')">${state.borrowers.map(x=>`<option value="${x.id}" ${x.id===filterState.sb?'selected':''}>${esc(x.name)} (${x.id})</option>`).join('')}</select></div>`;
    if(!b) return picker+`<div class="section"><div class="empty-state">${icon('empty')}<p>No borrowers yet.</p></div></div>`;
    const bl = borrowerLoans(b.id);
    const entries = [];
    bl.forEach(l=>{
      entries.push({date:l.startDate, desc:`Loan ${l.id} — capital released`, amount:l.principal, dir:'debit'});
      entries.push({date:l.startDate, desc:`Loan ${l.id} — interest at ${l.rate}%/month for ${l.months} month(s)`, amount:l.interestTotal, dir:'debit'});
    });
    state.payments.filter(p=>p.borrowerId===b.id).forEach(p=>entries.push({date:p.date, desc:`Payment received — ${p.method}${p.reference?' ('+p.reference+')':''}`, amount:p.amount, dir:'credit'}));
    entries.sort((a,c)=> a.date===c.date ? (a.dir==='debit'?-1:1) : (a.date<c.date?-1:1));
    let bal=0; const rows = entries.map(e=>{ bal += e.dir==='debit'?e.amount:-e.amount; return Object.assign({},e,{bal}); });
    window.__exp = ()=>downloadCSV('statement-'+b.id+'.csv',[['Date','Description','Amount','Balance'],...rows.map(r=>[r.date,r.desc,(r.dir==='debit'?r.amount:-r.amount),r.bal])]);
    const borrowed = bl.reduce((s,l)=>s+l.principal,0), repayable = bl.reduce((s,l)=>s+l.totalRepayable,0);
    const paid = bl.reduce((s,l)=>s+l.ledger.totalPaid,0), owed = bl.reduce((s,l)=>s+l.ledger.totalOutstanding,0);
    return picker + reportShell('Borrower statement', `${esc(b.name)} · ${b.id}`,
      `<div class="statement-figs">
        <div><div class="sf-label">Borrowed</div><div class="sf-value">${fmtNaira(borrowed)}</div></div>
        <div><div class="sf-label">Total repayable</div><div class="sf-value">${fmtNaira(repayable)}</div></div>
        <div><div class="sf-label">Paid</div><div class="sf-value">${fmtNaira(paid)}</div></div>
        <div><div class="sf-label">Still owed</div><div class="sf-value">${fmtNaira(owed)}</div></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.desc)}</td><td class="num mono" style="color:${r.dir==='debit'?'var(--red)':'var(--teal)'};">${r.dir==='debit'?'+':'−'}${fmtNaira(r.amount)}</td><td class="num mono">${fmtNaira(r.bal)}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  if(tab==='monthly'){
    const months=[]; for(let i=5;i>=0;i--) months.push(addMonths(TODAY,-i).slice(0,7));
    const rows = months.map(ym=>{
      let exp=0; state.loans.forEach(l=>l.schedule.forEach(p=>{ if(p.dueDate.slice(0,7)===ym) exp+=p.scheduled; }));
      let act=0; state.payments.forEach(p=>{ if(p.date.slice(0,7)===ym) act+=p.amount; });
      return {ym, exp, act};
    });
    window.__exp = ()=>downloadCSV('monthly.csv',[['Month','Expected','Received','Difference'],...rows.map(r=>[r.ym,r.exp,r.act,r.act-r.exp])]);
    return reportShell('Monthly performance','Expected against what actually came in',
      `<div class="table-wrap"><table><thead><tr><th>Month</th><th class="num">Expected</th><th class="num">Received</th><th class="num">Difference</th><th class="num">Rate</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.ym}</td><td class="num mono">${fmtNaira(r.exp)}</td><td class="num mono">${fmtNaira(r.act)}</td><td class="num mono" style="color:${r.act-r.exp<0?'var(--red)':'var(--teal)'};">${fmtNaira(r.act-r.exp)}</td><td class="num mono">${pct(r.act,r.exp)}%</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  if(tab==='audit'){
    window.__exp = ()=>downloadCSV('activity.csv',[['When','Action','Record','Detail'],...state.audit.map(a=>[new Date(a.timestamp).toISOString(),a.action,a.entityId,a.detail])]);
    return reportShell('Activity log', `${state.audit.length} entries`,
      `<div class="table-wrap"><table><thead><tr><th>When</th><th>Action</th><th>Record</th><th>Detail</th></tr></thead><tbody>
      ${state.audit.slice(0,200).map(a=>`<tr><td class="mono cell-sub">${fmtDateTime(a.timestamp)}</td><td class="cell-primary">${esc(a.action)}</td><td class="mono">${esc(a.entityId)}</td><td class="cell-sub">${esc(a.detail)}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  return '';
}
