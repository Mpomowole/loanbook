<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F4F7FC;
  --surface:#FFFFFF;
  --surface-2:#EDF2FA;
  --surface-3:#E0E9F6;
  --ink:#0F1D33;
  --ink-soft:#4C5C77;
  --ink-faint:#8B99B2;
  --border:#DCE5F3;
  --border-strong:#C1D0E7;
  --accent:#2158A6;
  --accent-strong:#153E7B;
  --accent-soft:#E3ECFB;
  --gold:#A9781F;
  --gold-soft:#F4E9D2;
  --red:#AD2E3E;
  --red-soft:#F7E3E5;
  --teal:#0E7C86;
  --teal-soft:#DFF1F2;
  --sidebar-bg:#0F2148;
  --sidebar-bg-2:#0A1830;
  --sidebar-text:#DCE6F7;
  --sidebar-text-dim:#7C92BB;
  --sidebar-active:#1C3B72;
  --shadow-sm:0 1px 2px rgba(15,29,51,0.06);
  --shadow-md:0 4px 16px rgba(15,29,51,0.08);
  --shadow-lg:0 12px 32px rgba(15,29,51,0.14);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:12px;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220;
    --surface:#101B2E;
    --surface-2:#172640;
    --surface-3:#1F3252;
    --ink:#E8EEF9;
    --ink-soft:#A4B3CC;
    --ink-faint:#677795;
    --border:#233250;
    --border-strong:#304469;
    --accent:#5C9AEA;
    --accent-strong:#8AB8F3;
    --accent-soft:#152A4A;
    --gold:#D9AE55;
    --gold-soft:#3A2F17;
    --red:#E2707D;
    --red-soft:#3B2024;
    --teal:#4FBAC4;
    --teal-soft:#123338;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220;
  --surface:#101B2E;
  --surface-2:#172640;
  --surface-3:#1F3252;
  --ink:#E8EEF9;
  --ink-soft:#A4B3CC;
  --ink-faint:#677795;
  --border:#233250;
  --border-strong:#304469;
  --accent:#5C9AEA;
  --accent-strong:#8AB8F3;
  --accent-soft:#152A4A;
  --gold:#D9AE55;
  --gold-soft:#3A2F17;
  --red:#E2707D;
  --red-soft:#3B2024;
  --teal:#4FBAC4;
  --teal-soft:#123338;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:700;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-0.01em;}
h1{font-size:22px;} h3{font-size:15px;}
a{color:var(--accent);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::selection{background:var(--accent-soft);}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

/* ============ SHELL ============ */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:236px;flex:none;background:var(--sidebar-bg);
  color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08);}
.brand-mark{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark svg{width:22px;height:22px;stroke:#fff;}
.brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:0.2px;}
.brand-sub{font-size:10.5px;color:var(--sidebar-text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:1px;}
nav.mainnav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text-dim);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;position:relative;}
.navlink svg{width:17px;height:17px;stroke:currentColor;flex:none;}
.navlink:hover{background:rgba(255,255,255,0.05);color:var(--sidebar-text);}
.navlink.active{background:var(--sidebar-active);color:#fff;}
.navlink.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--accent-strong);border-radius:0 3px 3px 0;}
.navlink .badge-count{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:var(--font-mono);}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--sidebar-text-dim);padding:14px 12px 6px;font-weight:600;}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.role-switch{display:flex;flex-direction:column;gap:6px;}
.role-switch label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--sidebar-text-dim);}
.role-switch select{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:7px 8px;border-radius:7px;font-size:12.5px;font-family:var(--font-body);}
.user-chip{display:flex;align-items:center;gap:9px;margin-top:12px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#241b06;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
.user-name{color:#fff;font-size:12.5px;font-weight:600;}
.user-role{color:var(--sidebar-text-dim);font-size:10.5px;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:12px 28px;background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.search-wrap{position:relative;flex:1;max-width:420px;}
.search-input{
  width:100%;padding:9px 14px 9px 36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13.5px;font-family:var(--font-body);
}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-faint);pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:360px;overflow-y:auto;z-index:50;}
.search-results .sr-item{display:flex;flex-direction:column;gap:1px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover{background:var(--surface-2);}
.sr-title{font-size:13px;font-weight:600;}
.sr-meta{font-size:11.5px;color:var(--ink-soft);}
.sr-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--surface);}
.notif-panel{position:absolute;top:56px;right:28px;width:360px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.notif-list{max-height:400px;overflow-y:auto;}
.notif-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-dotcolor{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
.notif-text{font-size:12.5px;line-height:1.45;}
.notif-time{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}

#app{flex:1;padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}

/* ============ PAGE HEADER ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);font-weight:600;margin-bottom:4px;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:5px;max-width:560px;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
.btn svg{width:15px;height:15px;stroke:currentColor;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-danger{color:var(--red);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn:disabled:hover{background:var(--surface);}

/* ============ KPI GRID ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:17px 18px;}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.9px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi-value{font-size:26px;font-weight:600;margin-top:8px;color:var(--ink);}
.kpi-value.mono{font-family:var(--font-mono);font-size:22px;}
.kpi-value.warn{color:var(--gold);}
.kpi-value.danger{color:var(--red);}
.kpi-sub{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
.mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.mini-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
.mini-card .mc-label{font-size:12px;color:var(--ink-soft);font-weight:500;}
.mini-card .mc-value{font-family:var(--font-mono);font-size:19px;font-weight:600;}

/* ============ CARD / SECTION ============ */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.section-head h3{font-size:16px;}
.section-head .shint{font-size:11.5px;color:var(--ink-faint);}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:1080px){.grid-2{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);} .mini-row{grid-template-columns:1fr;}}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-soft);
  padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;
  position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--ink);}
thead th .sort-arrow{opacity:0.5;margin-left:3px;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.rowlink{cursor:pointer;}
tbody tr.rowlink:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.cell-primary{font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);}
.table-empty{padding:40px;text-align:center;color:var(--ink-faint);font-size:13px;}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.input,select.select,textarea.textarea{
  padding:8px 11px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  font-size:13px;font-family:var(--font-body);
}
select.select{padding:8px 30px 8px 11px;}
textarea.textarea{width:100%;resize:vertical;min-height:64px;font-family:var(--font-body);}
.input:focus,select.select:focus,textarea.textarea:focus{border-color:var(--accent);}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-active{background:var(--teal-soft);color:var(--teal);}
.badge-current{background:var(--accent-soft);color:var(--accent);}
.badge-paid{background:var(--accent-soft);color:var(--accent);}
.badge-completed{background:var(--accent-soft);color:var(--accent);}
.badge-partial{background:var(--gold-soft);color:var(--gold);}
.badge-pending{background:var(--surface-3);color:var(--ink-soft);}
.badge-duetoday{background:var(--gold-soft);color:var(--gold);}
.badge-overdue{background:var(--red-soft);color:var(--red);}
.badge-defaulted{background:var(--red-soft);color:var(--red);}
.badge-cancelled{background:var(--surface-3);color:var(--ink-faint);}

/* ============ CHARTS ============ */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.chart-box{position:relative;height:230px;}

/* ============ PROGRESS ============ */
.progress-track{height:10px;background:var(--surface-3);border-radius:20px;overflow:hidden;position:relative;}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width 0.4s ease;}
.progress-fill.gold{background:var(--gold);}
.progress-fill.red{background:var(--red);}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,12,0.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:40px 20px;overflow-y:auto;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.modal-box.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:18px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.close-x:hover{background:var(--surface-3);}
.close-x svg{width:15px;height:15px;stroke:currentColor;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.form-field .hint{font-size:10.5px;color:var(--ink-faint);}
.form-field .req{color:var(--red);}
fieldset{border:none;padding:0;margin:0;}
.fieldset-legend{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);margin:18px 0 10px;padding-top:14px;border-top:1px dashed var(--border);}
.fieldset-legend:first-child{margin-top:0;padding-top:0;border-top:none;}
.calc-preview{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;}
.calc-preview .cp-item .cp-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
.calc-preview .cp-item .cp-value{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:2px;}

/* ============ TOAST ============ */
#toastRoot{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:300;}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;max-width:340px;animation:toastin 0.25s ease;}
.toast.success{border-left:3px solid var(--accent-strong);}
.toast.error{border-left:3px solid var(--red);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============ PROFILE / DETAIL ============ */
.detail-header{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;}
.avatar-lg{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none;}
.detail-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.detail-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-soft);}
.detail-meta-row span{display:flex;align-items:center;gap:5px;}
.stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0;}
.stat-strip .st{background:var(--surface-2);border-radius:10px;padding:12px 14px;}
.stat-strip .st-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;font-weight:600;}
.stat-strip .st-value{font-family:var(--font-mono);font-size:17px;font-weight:600;margin-top:4px;}
@media(max-width:1080px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.notes-list{display:flex;flex-direction:column;gap:10px;}
.note-item{background:var(--surface-2);border-radius:10px;padding:11px 14px;border-left:3px solid var(--gold);}
.note-text{font-size:13px;line-height:1.5;}
.note-meta{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.audit-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-item:last-child{border-bottom:none;}
.audit-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
.audit-text{color:var(--ink);}

<script>
/* =========================================================================
   LOANBOOK — client-side loan portfolio ledger. No backend: all state lives
   in localStorage. The financial engine treats every payment as an
   immutable transaction and derives schedule status, balances and loan
   status fresh on every read (see computeLedger) rather than storing a
   mutable "paid/unpaid" flag — this is what makes rollover automatic.
   ========================================================================= */

const STORAGE_KEY = 'loanbook_v1';
const TODAY = toISO(new Date());

/* ---------- small utilities ---------- */
function toISO(dt){ const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
function todayISO(){ return toISO(new Date()); }
function addMonths(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1+n,1); const lastDay=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); const day=Math.min(d,lastDay); return toISO(new Date(t.getFullYear(),t.getMonth(),day)); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function fmtNaira(n){ const neg=n<0; n=Math.round(Math.abs(n)); let s=String(n),out=''; for(let i=0;i<s.length;i++){ if(i>0 && (s.length-i)%3===0) out+=','; out+=s[i]; } return (neg?'-':'')+'₦'+out; }
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${String(d).padStart(2,'0')} ${months[m-1]} ${y}`; }
function fmtDateTime(iso){ const d=new Date(iso); return fmtDate(toISO(d))+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function relTime(iso){ const d=daysBetween(toISO(new Date(iso)),TODAY); if(d===0) return 'Today'; if(d===1) return 'Yesterday'; if(d>1) return d+'d ago'; if(d===-1) return 'Tomorrow'; return 'in '+(-d)+'d'; }

/* ---------- icon set ---------- */
const ICONS = {

  borrowers:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  loans:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>',
  payments:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>',

  notif:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H3a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-3"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',

  mail:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>',
};
function icon(name){ return ICONS[name]||''; }

/* =========================== STATE =========================== */
let state = null;
let route = '#/dashboard';
let sortState = {};
let filterState = {};
let charts = {};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){}
  state = { borrowers:[], loans:[], payments:[], notes:[], audit:[], seq:{borrower:0,loan:0,payment:0,note:0,audit:0}, currentUser:{name:'Admin User', role:'Administrator'} };
  seedData();
  save();
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function nextId(kind,prefix){ state.seq[kind]++; return prefix+'-'+String(state.seq[kind]).padStart(4,'0'); }

/* =========================== FINANCIAL ENGINE =========================== */
function calcLoanFinancials(principal, ratePct, type, durationMonths){
  let interestAmount, totalRepayable, instalment;
  if(type === 'reducing'){
    const r = (ratePct/100)/12;
    if(r === 0){ instalment = principal/durationMonths; }
    else { instalment = principal*r/(1-Math.pow(1+r,-durationMonths)); }
    totalRepayable = instalment*durationMonths;
    interestAmount = totalRepayable - principal;
  } else {
    interestAmount = principal * (ratePct/100);
    totalRepayable = principal + interestAmount;
    instalment = totalRepayable/durationMonths;
  }
  return { interestAmount: Math.round(interestAmount), totalRepayable: Math.round(totalRepayable), instalment: Math.round(instalment) };
}
function generateSchedule(totalRepayable, durationMonths, firstPaymentDate){
  const base = Math.floor(totalRepayable/durationMonths);
  let sum=0; const periods=[];
  for(let i=1;i<=durationMonths;i++){
    let scheduled = base;
    if(i===durationMonths) scheduled = totalRepayable - sum;
    sum += scheduled;
    periods.push({ period:i, dueDate: addMonths(firstPaymentDate,i-1), scheduled });
  }
  return periods;
}
function getLoanPayments(loanId){
  return state.payments.filter(p=>p.loanId===loanId).sort((a,b)=> a.date===b.date ? a.timestamp-b.timestamp : (a.date<b.date?-1:1));
}
function computeLedger(loan){
  const pays = getLoanPayments(loan.id);
  const totalReceived = pays.reduce((s,p)=>s+p.amount,0);
  let remaining = totalReceived;
  let overdueAmount = 0, nextDue = null;
  const detailed = loan.schedule.map(period=>{
    const allocated = Math.max(0, Math.min(remaining, period.scheduled));
    remaining -= allocated;
    const outstanding = period.scheduled - allocated;
    let status;
    if(outstanding <= 0){ status='Paid'; }
    else if(allocated > 0){ status = period.dueDate < TODAY ? 'Overdue' : 'Partial'; }
    else { status = period.dueDate < TODAY ? 'Overdue' : (period.dueDate === TODAY ? 'Due Today' : 'Pending'); }
    if(outstanding > 0 && period.dueDate < TODAY) overdueAmount += outstanding;
    if(outstanding > 0 && !nextDue) nextDue = { date: period.dueDate, amount: outstanding, period: period.period };
    return Object.assign({}, period, { allocated, outstanding, status });
  });
  const advanceCredit = Math.max(0, remaining);
  const totalOutstanding = Math.max(0, loan.totalRepayable - totalReceived);
  const oldestOverdue = detailed.find(p=>p.status==='Overdue');
  let status;
  if(totalOutstanding <= 0) status = 'Completed';
  else if(oldestOverdue){ status = daysBetween(oldestOverdue.dueDate, TODAY) > 90 ? 'Defaulted' : 'Overdue'; }
  else if(totalReceived > 0) status = 'Current';
  else status = 'Active';
  const pctPaid = loan.totalRepayable > 0 ? Math.min(100, Math.round((totalReceived/loan.totalRepayable)*1000)/10) : 0;
  return { schedule:detailed, totalPaid:totalReceived, totalOutstanding, overdueAmount, advanceCredit, nextDue, status, pctPaid, paymentsCount: pays.length };
}
function loanWithLedger(loan){ return Object.assign({}, loan, { ledger: computeLedger(loan) }); }
function allLoansWithLedger(){ return state.loans.map(loanWithLedger); }
function getBorrower(id){ return state.borrowers.find(b=>b.id===id); }
function getLoan(id){ return state.loans.find(l=>l.id===id); }
function borrowerLoans(borrowerId){ return allLoansWithLedger().filter(l=>l.borrowerId===borrowerId); }

/* =========================== MUTATIONS (+ audit) =========================== */
function logAudit(action, entity, entityId, detail){
  state.audit.unshift({ id: nextId('audit','AUD'), action, entity, entityId, detail, user: state.currentUser.name, timestamp: Date.now() });
}
function addBorrower(data, opts){
  opts = opts||{};
  const b = {
    id: nextId('borrower','BR'), name:data.name, phone:data.phone, email:data.email||'', address:data.address||'',
    idType:data.idType||'', idNumber:data.idNumber||'', dateAdded: data.dateAdded||TODAY, status: data.status||'Active',
    nextOfKin:data.nextOfKin||'', nextOfKinPhone:data.nextOfKinPhone||'', employment:data.employment||'', bankInfo:data.bankInfo||''
  };
  state.borrowers.push(b);
  logAudit('Borrower Created','Borrower',b.id,`${b.name} added to the register`);
  if(!opts.silent) save();
  return b;
}
function addLoan(data, opts){
  opts = opts||{};
  const fin = calcLoanFinancials(data.principal, data.interestRate, data.interestType, data.durationMonths);
  const schedule = generateSchedule(fin.totalRepayable, data.durationMonths, data.firstPaymentDate);
  const loan = {
    id: nextId('loan','LN'), borrowerId:data.borrowerId, principal:data.principal, interestRate:data.interestRate,
    interestType:data.interestType, interestAmount:fin.interestAmount, totalRepayable:fin.totalRepayable,
    startDate:data.startDate, firstPaymentDate:data.firstPaymentDate, durationMonths:data.durationMonths,
    frequency:'Monthly', instalment:fin.instalment, purpose:data.purpose||'', createdDate: data.createdDate||TODAY, schedule
  };
  state.loans.push(loan);
  const b = getBorrower(loan.borrowerId);
  logAudit('Loan Created','Loan',loan.id,`${fmtNaira(loan.principal)} loan created for ${b?b.name:loan.borrowerId} (${loan.durationMonths}mo @ ${loan.interestRate}% ${loan.interestType})`);
  if(!opts.silent) save();
  return loan;
}
function addPayment(data, opts){
  opts = opts||{};
  const p = {
    id: nextId('payment','PMT'), loanId:data.loanId, borrowerId:data.borrowerId, date:data.date, amount:data.amount,
    method:data.method, reference:data.reference||'', notes:data.notes||'', recordedBy: state.currentUser.name,
    timestamp: data.timestamp || Date.now()
  };
  state.payments.push(p);
  const loan = getLoan(p.loanId); const b = getBorrower(p.borrowerId);
  logAudit('Payment Recorded','Payment',p.id,`${fmtNaira(p.amount)} recorded on ${loan?loan.id:''} for ${b?b.name:''} via ${p.method}`);
  if(!opts.silent) save();
  return p;
}
function addNote(data, opts){
  opts = opts||{};
  const n = { id: nextId('note','NOTE'), borrowerId:data.borrowerId||null, loanId:data.loanId||null, text:data.text, createdBy: state.currentUser.name, createdAt: data.createdAt || Date.now() };
  state.notes.unshift(n);
  logAudit('Note Added', data.loanId?'Loan':'Borrower', data.loanId||data.borrowerId, n.text.slice(0,60));
  if(!opts.silent) save();
  return n;
}

/* =========================== DASHBOARD METRICS =========================== */
function dashboardMetrics(){
  const loans = allLoansWithLedger();
  const activeStatuses = ['Active','Current','Overdue','Defaulted'];
  const totalDisbursed = state.loans.reduce((s,l)=>s+l.principal,0);
  const totalExpected = state.loans.reduce((s,l)=>s+l.totalRepayable,0);
  const totalCollected = state.payments.reduce((s,p)=>s+p.amount,0);
  const totalOutstanding = loans.reduce((s,l)=>s+l.ledger.totalOutstanding,0);
  const totalOverdue = loans.reduce((s,l)=>s+l.ledger.overdueAmount,0);
  const overdueLoans = loans.filter(l=>l.ledger.status==='Overdue'||l.ledger.status==='Defaulted');
  const activeLoans = loans.filter(l=>activeStatuses.includes(l.ledger.status));
  const completedLoans = loans.filter(l=>l.ledger.status==='Completed');
  const weekEnd = addDaysISO(TODAY,7); const monthEnd = addMonths(TODAY,1);
  function dueWithin(fromIncl,toExcl){ return loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date>=fromIncl && l.ledger.nextDue.date<toExcl).length; }
  return {
    totalBorrowers: state.borrowers.length, activeLoans: activeLoans.length, totalDisbursed, totalExpected, totalCollected,
    totalOutstanding, totalOverdue, overdueLoansCount: overdueLoans.length, completedLoans: completedLoans.length,
    dueToday: loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date===TODAY).length,
    dueThisWeek: dueWithin(TODAY, weekEnd), dueThisMonth: dueWithin(TODAY, monthEnd),
    overdueLoansList: overdueLoans, upcoming: loans.filter(l=>l.ledger.nextDue && l.ledger.nextDue.date>TODAY).sort((a,b)=>a.ledger.nextDue.date<b.ledger.nextDue.date?-1:1).slice(0,6)
  };
}
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }

/* =========================== NOTIFICATIONS =========================== */
function buildNotifications(){
  const loans = allLoansWithLedger();
  const items = [];
  loans.forEach(l=>{
    const b = getBorrower(l.borrowerId);
    const nm = b?b.name:l.borrowerId;
    if(l.ledger.status==='Overdue' || l.ledger.status==='Defaulted'){
      items.push({type:'overdue', color:'var(--red)', text:`<b>${esc(nm)}</b> has an outstanding overdue balance of ${fmtNaira(l.ledger.overdueAmount)} on ${l.id}.`, time:l.ledger.nextDue?l.ledger.nextDue.date:TODAY, sort:3});
    } else if(l.ledger.nextDue && l.ledger.nextDue.date===TODAY){
      items.push({type:'due', color:'var(--gold)', text:`Payment of ${fmtNaira(l.ledger.nextDue.amount)} for <b>${esc(nm)}</b> (${l.id}) is due today.`, time:TODAY, sort:2});
    } else if(l.ledger.nextDue && l.ledger.nextDue.date>TODAY && daysBetween(TODAY,l.ledger.nextDue.date)<=3){
      items.push({type:'upcoming', color:'var(--teal)', text:`Payment of ${fmtNaira(l.ledger.nextDue.amount)} for <b>${esc(nm)}</b> is due in ${daysBetween(TODAY,l.ledger.nextDue.date)}d.`, time:l.ledger.nextDue.date, sort:1});
    }
    if(l.ledger.status==='Completed'){
      items.push({type:'completed', color:'var(--accent)', text:`<b>${esc(nm)}</b> has completed repayment on ${l.id}.`, time:l.createdDate, sort:0});
    }
  });
  const recentPartials = state.payments.filter(p=>{ const loan=getLoan(p.loanId); if(!loan) return false; const per=loan.schedule.find(s=>p.date>=s.dueDate) ; return true; }).slice(-4);
  [...state.payments].sort((a,b)=>b.timestamp-a.timestamp).slice(0,3).forEach(p=>{
    const b=getBorrower(p.borrowerId); const loan=getLoan(p.loanId); if(!loan) return;
    const led = computeLedger(loan);
    const per = loan.schedule.find(s=>s.dueDate<=p.date) ;
  });
  items.sort((a,b)=> b.sort-a.sort || (a.time<b.time?-1:1));
  return items;
}

function navigate(r){ route = r; location.hash = r; closeAllPanels(); closeSidebar(); render(); window.scrollTo(0,0); }

function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }

function render(){
  renderNav();
  const app = document.getElementById('app');
  const parts = route.replace('#/','').split('/');
  const page = parts[0]||'dashboard';
  try{
    if(page==='dashboard') app.innerHTML = pageDashboard();
    else if(page==='borrowers' && parts[1]) app.innerHTML = pageBorrowerProfile(parts[1]);
    else if(page==='borrowers') app.innerHTML = pageBorrowers();
    else if(page==='loans' && parts[1]) app.innerHTML = pageLoanDetail(parts[1]);
    else if(page==='loans') app.innerHTML = pageLoans();

function toast(msg, type){
  type = type||'success';
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = (type==='success' ? '✓ ' : '! ') + msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3600);
}

function pageBorrowers(){
  const q = (filterState.borrowerSearch||'').toLowerCase();
  let rows = state.borrowers.map(b=>{

    const totalOutstanding = loans.reduce((s,l)=>s+l.ledger.totalOutstanding,0);
    const activeCount = loans.filter(l=>['Active','Current','Overdue','Defaulted'].includes(l.ledger.status)).length;
    const hasOverdue = loans.some(l=>l.ledger.status==='Overdue'||l.ledger.status==='Defaulted');
    return { b, loans, totalOutstanding, activeCount, hasOverdue };
  });
  if(q) rows = rows.filter(r=> r.b.name.toLowerCase().includes(q) || r.b.phone.includes(q) || r.b.email.toLowerCase().includes(q) || r.b.id.toLowerCase().includes(q));
  const sortKey = sortState.borrowers || {key:'name',dir:1};
  rows.sort((a,b)=>{
    let av,bv;
    if(sortKey.key==='name'){ av=a.b.name; bv=b.b.name; }
    else if(sortKey.key==='loans'){ av=a.activeCount; bv=b.activeCount; }
    else if(sortKey.key==='outstanding'){ av=a.totalOutstanding; bv=b.totalOutstanding; }
    else { av=a.b.dateAdded; bv=b.b.dateAdded; }
    return (av>bv?1:av<bv?-1:0) * sortKey.dir;
  });

/* =========================== PAGE: LOANS =========================== */
function pageLoans(){
  filterState.loanStatus = filterState.loanStatus || 'All';
  const q = (filterState.loanSearch||'').toLowerCase();
  let loans = allLoansWithLedger();
  if(filterState.loanStatus!=='All') loans = loans.filter(l=>l.ledger.status===filterState.loanStatus);
  if(q) loans = loans.filter(l=>{ const b=getBorrower(l.borrowerId); return l.id.toLowerCase().includes(q) || (b&&b.name.toLowerCase().includes(q)); });
  const sk = sortState.loans||{key:'created',dir:-1};
  loans.sort((a,b)=>{ let av,bv;
    if(sk.key==='borrower'){ av=(getBorrower(a.borrowerId)||{}).name||''; bv=(getBorrower(b.borrowerId)||{}).name||''; }
    else if(sk.key==='principal'){ av=a.principal; bv=b.principal; }
    else if(sk.key==='outstanding'){ av=a.ledger.totalOutstanding; bv=b.ledger.totalOutstanding; }
    else if(sk.key==='due'){ av=(a.ledger.nextDue?a.ledger.nextDue.date:'9999'); bv=(b.ledger.nextDue?b.ledger.nextDue.date:'9999'); }
    else { av=a.createdDate; bv=b.createdDate; }
    return (av>bv?1:av<bv?-1:0)*sk.dir; });
  const statuses = ['All','Active','Current','Overdue','Defaulted','Completed'];
  return `
  <div class="page-head">
    <div><div class="page-eyebrow">Loan Portfolio</div><h1>Loans</h1><p class="page-sub">Every loan on the book with live balances, next due dates and status.</p></div>
    <div class="head-actions">
      <button class="btn" onclick="exportLoansCSV()">${icon('download')} Export CSV</button>
      <button class="btn btn-primary" data-requires-edit onclick="openAddLoanModal()">${icon('plus')} New Loan</button>
    </div>
  </div>
  <div class="section">
    <div class="table-toolbar">
      <input class="input" style="flex:1;min-width:200px;" placeholder="Search loan ID or borrower..." value="${esc(filterState.loanSearch||'')}" oninput="filterState.loanSearch=this.value; renderBody('loans')">
      <div class="pill-group">${statuses.map(s=>`<button class="filter-pill ${filterState.loanStatus===s?'active':''}" onclick="filterState.loanStatus='${s}'; renderBody('loans')">${s}</button>`).join('')}</div>
    </div>
    ${loansTable(loans)}
  </div>`;
}
function loansTable(loans){
  if(!loans.length) return `<div class="empty-state">${icon('empty')}<p>No loans match this filter.</p></div>`;
  const sk = sortState.loans||{key:'created',dir:-1};
  const arrow = k => sk.key===k ? (sk.dir===1?'↑':'↓') : '';
  return `<div class="table-wrap"><table><thead><tr>
    <th>Loan</th><th class="sortable" onclick="sortLoans('borrower')">Borrower ${arrow('borrower')}</th>
    <th class="num sortable" onclick="sortLoans('principal')">Principal ${arrow('principal')}</th>
    <th class="num">Total Repayable</th><th class="num">Paid</th>
    <th class="num sortable" onclick="sortLoans('outstanding')">Outstanding ${arrow('outstanding')}</th>
    <th class="sortable" onclick="sortLoans('due')">Next Due ${arrow('due')}</th><th>Duration</th><th>Status</th>
  </tr></thead><tbody>
  ${loans.map(l=>{ const b=getBorrower(l.borrowerId);
    return `<tr class="rowlink" onclick="navigate('#/loans/${l.id}')">
      <td class="mono cell-primary">${l.id}</td>
      <td>${esc(b?b.name:'—')}</td>
      <td class="num mono">${fmtNaira(l.principal)}</td>
      <td class="num mono">${fmtNaira(l.totalRepayable)}</td>
      <td class="num mono">${fmtNaira(l.ledger.totalPaid)}</td>
      <td class="num mono" style="${l.ledger.totalOutstanding>0 && l.ledger.status!=='Active'?'color:var(--gold);':''}${l.ledger.overdueAmount>0?'color:var(--red);':''}">${fmtNaira(l.ledger.totalOutstanding)}</td>
      <td>${l.ledger.nextDue?fmtDate(l.ledger.nextDue.date):'—'}</td>

      <td>${statusBadge(l.ledger.status)}</td>
    </tr>`; }).join('')}
  </tbody></table></div>`;
}
function sortLoans(key){ const cur=sortState.loans||{key:'created',dir:-1}; sortState.loans={key,dir:cur.key===key?-cur.dir:1}; renderBody('loans'); }
function exportLoansCSV(){
  const loans = allLoansWithLedger();
  const rows = [['Loan ID','Borrower','Principal','Interest Rate','Interest Type','Total Repayable','Amount Paid','Outstanding','Overdue','Next Due Date','Duration (months)','Start Date','Status']];
  loans.forEach(l=>{ const b=getBorrower(l.borrowerId); rows.push([l.id, b?b.name:'', l.principal, l.interestRate+'%', l.interestType, l.totalRepayable, l.ledger.totalPaid, l.ledger.totalOutstanding, l.ledger.overdueAmount, l.ledger.nextDue?l.ledger.nextDue.date:'', l.durationMonths, l.startDate, l.ledger.status]); });
  downloadCSV('loan-portfolio.csv', rows);
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Exported '+filename);
}

/* =========================== GLOBAL SEARCH =========================== */
function onGlobalSearch(q){
  const root = document.getElementById('searchResults');
  if(!q || q.trim().length<1){ root.innerHTML=''; root.classList.remove('search-results'); return; }
  root.classList.add('search-results');
  const ql = q.toLowerCase();
  const results = [];
  state.borrowers.forEach(b=>{ if(b.name.toLowerCase().includes(ql)||b.phone.includes(ql)||b.email.toLowerCase().includes(ql)) results.push({title:b.name, meta:`Borrower · ${b.id} · ${b.phone}`, go:`#/borrowers/${b.id}`}); });
  state.loans.forEach(l=>{ const b=getBorrower(l.borrowerId); if(l.id.toLowerCase().includes(ql)) results.push({title:l.id, meta:`Loan · ${b?b.name:''} · ${fmtNaira(l.principal)}`, go:`#/loans/${l.id}`}); });
  state.payments.forEach(p=>{ if((p.reference||'').toLowerCase().includes(ql)){ const b=getBorrower(p.borrowerId); results.push({title:p.reference, meta:`Payment · ${fmtNaira(p.amount)} · ${b?b.name:''}`, go:`#/loans/${p.loanId}`}); } });
  root.innerHTML = results.length ? results.slice(0,8).map(r=>`<div class="sr-item" onmousedown="navigate('${r.go}'); document.getElementById('globalSearch').value=''; document.getElementById('searchResults').innerHTML='';"><div class="sr-title">${esc(r.title)}</div><div class="sr-meta">${esc(r.meta)}</div></div>`).join('') : `<div class="sr-empty">No matches for "${esc(q)}"</div>`;
}

        <div class="calc-preview" id="loanPreview">
          <div class="cp-item"><div class="cp-label">Interest Amount</div><div class="cp-value" id="pvInterest">₦0</div></div>
          <div class="cp-item"><div class="cp-label">Total Repayable</div><div class="cp-value" id="pvTotal">₦0</div></div>
          <div class="cp-item"><div class="cp-label">Monthly Instalment</div><div class="cp-value" id="pvInstalment">₦0</div></div>
          <div class="cp-item"><div class="cp-label">Number of Periods</div><div class="cp-value" id="pvPeriods">0</div></div>
        </div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Create Loan &amp; Generate Schedule</button></div>
    </form>`, {wide:true});
  syncFirstPayment();
}
function syncFirstPayment(){
  const start = document.getElementById('loanStart').value || TODAY;
  document.getElementById('loanFirstPay').value = addMonths(start,1);
  updateLoanPreview();
}
function updateLoanPreview(){
  const principal = parseFloat(document.getElementById('loanPrincipal').value)||0;
  const rate = parseFloat(document.getElementById('loanRate').value)||0;
  const type = document.getElementById('loanType').value;
  const duration = parseInt(document.getElementById('loanDuration').value)||0;
  if(!principal || !duration){ document.getElementById('pvInterest').textContent='₦0'; document.getElementById('pvTotal').textContent='₦0'; document.getElementById('pvInstalment').textContent='₦0'; document.getElementById('pvPeriods').textContent='0'; return; }
  const fin = calcLoanFinancials(principal, rate, type, duration);
  document.getElementById('pvInterest').textContent = fmtNaira(fin.interestAmount);
  document.getElementById('pvTotal').textContent = fmtNaira(fin.totalRepayable);
  document.getElementById('pvInstalment').textContent = fmtNaira(fin.instalment)+'/mo';
  document.getElementById('pvPeriods').textContent = duration;
}
function submitAddLoan(e){
  e.preventDefault();
  const f = new FormData(e.target); const data = Object.fromEntries(f.entries());
  data.principal = parseFloat(data.principal); data.interestRate = parseFloat(data.interestRate); data.durationMonths = parseInt(data.durationMonths);
  if(!data.borrowerId || !data.principal || data.principal<=0 || !data.durationMonths || data.durationMonths<=0){ toast('Please fill all required fields with valid values','error'); return false; }
  const loan = addLoan(data);
  closeModal(); toast(`Loan ${loan.id} created — schedule generated for ${loan.durationMonths} periods`);
  navigate('#/loans/'+loan.id);
  return false;
}

/* =========================== MODALS: RECORD PAYMENT =========================== */
function openRecordPaymentModal(borrowerId, loanId){
  if(!canEdit()){ toast('Viewers cannot record payments','error'); return; }
  if(!state.loans.length){ toast('Create a loan first','error'); return; }
  const bOptions = state.borrowers.map(b=>`<option value="${b.id}" ${b.id===borrowerId?'selected':''}>${esc(b.name)}</option>`).join('');
  openModal(`
    <form onsubmit="return submitRecordPayment(event)">
      <div class="modal-head"><h3>Record Payment</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field"><label>Borrower <span class="req">*</span></label><select class="select" name="borrowerId" id="payBorrowerSel" required onchange="syncLoanOptions()">${bOptions}</select></div>
          <div class="form-field"><label>Loan <span class="req">*</span></label><select class="select" name="loanId" id="payLoanSel" required onchange="updatePaymentContext()"></select></div>
          <div class="form-field"><label>Amount <span class="req">*</span></label><input class="input" type="number" min="1" step="1" name="amount" required id="payAmount" oninput="updatePaymentContext()"></div>
          <div class="form-field"><label>Date <span class="req">*</span></label><input class="input" type="date" name="date" required value="${TODAY}"></div>
          <div class="form-field"><label>Payment Method <span class="req">*</span></label><select class="select" name="method" required><option>Bank Transfer</option><option>Cash</option><option>POS</option><option>Direct Debit</option><option>Other</option></select></div>
          <div class="form-field"><label>Reference / Receipt No.</label><input class="input" name="reference" placeholder="e.g. REF-1029"></div>
          <div class="form-field full"><label>Notes / Comments</label><textarea class="textarea" name="notes" placeholder="Optional context for this payment..."></textarea></div>
        </div>
        <div class="calc-preview" id="payPreview"></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Record Payment</button></div>
    </form>`);
  syncLoanOptions(loanId);
}
function syncLoanOptions(preselectLoanId){
  const bid = document.getElementById('payBorrowerSel').value;
  const loans = state.loans.filter(l=>l.borrowerId===bid);
  document.getElementById('payLoanSel').innerHTML = loans.map(l=>{ const led=computeLedger(l); return `<option value="${l.id}" ${l.id===preselectLoanId?'selected':''}>${l.id} — ${fmtNaira(led.totalOutstanding)} outstanding</option>`; }).join('') || '<option value="">No loans for this borrower</option>';
  updatePaymentContext();
}
function updatePaymentContext(){
  const loanId = document.getElementById('payLoanSel').value;
  const box = document.getElementById('payPreview');
  const loan = getLoan(loanId);
  if(!loan){ box.innerHTML=''; return; }
  const led = computeLedger(loan);
  const amt = parseFloat(document.getElementById('payAmount').value)||0;
  const newOutstanding = Math.max(0, led.totalOutstanding - amt);
  box.innerHTML = `
    <div class="cp-item"><div class="cp-label">Currently Outstanding</div><div class="cp-value">${fmtNaira(led.totalOutstanding)}</div></div>
    <div class="cp-item"><div class="cp-label">Currently Overdue</div><div class="cp-value" style="${led.overdueAmount>0?'color:var(--red);':''}">${fmtNaira(led.overdueAmount)}</div></div>
    <div class="cp-item"><div class="cp-label">Outstanding After This Payment</div><div class="cp-value" style="color:var(--accent);">${fmtNaira(newOutstanding)}</div></div>
    <div class="cp-item"><div class="cp-label">Next Due Date</div><div class="cp-value">${led.nextDue?fmtDate(led.nextDue.date):'—'}</div></div>`;
}
function submitRecordPayment(e){
  e.preventDefault();
  const f = new FormData(e.target); const data = Object.fromEntries(f.entries());
  data.amount = parseFloat(data.amount);
  if(!data.loanId || !data.amount || data.amount<=0){ toast('Select a loan and enter a valid amount','error'); return false; }
  const loan = getLoan(data.loanId);
  const beforeLed = computeLedger(loan);
  const p = addPayment(data);
  const afterLed = computeLedger(loan);
  closeModal();
  let msg = `${fmtNaira(p.amount)} recorded. Outstanding: ${fmtNaira(afterLed.totalOutstanding)}.`;
  if(afterLed.status==='Completed') msg = `${fmtNaira(p.amount)} recorded — loan ${loan.id} is now fully repaid! 🎉`.replace(' 🎉','');
  else if(beforeLed.totalOutstanding - p.amount < 0) msg = `${fmtNaira(p.amount)} recorded with ${fmtNaira(afterLed.advanceCredit)} applied as advance credit toward future instalments.`;
  toast(msg);
  navigate('#/loans/'+loan.id);
  return false;
}

/* =========================== MODAL: ADD NOTE =========================== */
function openAddNoteModal(ctx){
  if(!canEdit()){ toast('Viewers cannot add notes','error'); return; }
  openModal(`
    <form onsubmit="return submitAddNote(event,'${ctx.borrowerId||''}','${ctx.loanId||''}')">
      <div class="modal-head"><h3>Add Note</h3><button type="button" class="close-x" onclick="closeModal()">${closeIcon()}</button></div>
      <div class="modal-body">
        <div class="form-field full"><label>Note</label><textarea class="textarea" name="text" required autofocus placeholder="e.g. Borrower requested payment date to be moved..."></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save Note</button></div>
    </form>`);
}
function submitAddNote(e, borrowerId, loanId){
  e.preventDefault();
  const f = new FormData(e.target); const text = f.get('text');
  if(!text || !text.trim()){ return false; }
  addNote({ borrowerId: borrowerId||null, loanId: loanId||null, text: text.trim() });
  closeModal(); toast('Note added');
  render();
  return false;
}
function closeIcon(){ return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

/* =========================== INIT =========================== */
function init(){
  loadState();
  document.getElementById('userAvatar').textContent = initials(state.currentUser.name);
  document.getElementById('userName').textContent = state.currentUser.name;
  document.getElementById('userRoleLabel').textContent = state.currentUser.role;
  document.getElementById('roleSelect').value = state.currentUser.role;
  route = location.hash || '#/dashboard';
  render();
}
init();
</script>
</body>
